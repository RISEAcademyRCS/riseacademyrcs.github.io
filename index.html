*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ash);overflow:hidden}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}
body:not(.awake){cursor:none}

#wrap{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--ink)}
#stage{position:relative;flex:0 0 auto;width:1920px;height:1080px;zoom:.5;overflow:hidden;
  background:radial-gradient(1300px 640px at 78% 118%,rgba(255,106,26,.26),transparent 62%),radial-gradient(900px 520px at 6% -12%,rgba(245,180,0,.12),transparent 60%),var(--ink)}
#embers{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* rail */
.rail{position:absolute;left:0;top:0;bottom:96px;width:560px;padding:52px 56px 40px;overflow:hidden;display:flex;flex-direction:column;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(22,17,12,.9),rgba(11,8,6,.35))}
.brand{display:flex;align-items:center;gap:22px}
.brand .logo{width:104px;height:104px;flex:0 0 auto;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 26px rgba(255,106,26,.4))}
.brand .nm{font:800 48px/.92 var(--display);letter-spacing:.04em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:10px;margin-top:12px;font:700 17px/1 var(--body);letter-spacing:.24em;color:var(--gold)}
.live i{width:12px;height:12px;border-radius:50%;background:#FF3B1F;animation:pulse 1.8s infinite}
.clock{margin-top:34px;display:flex;align-items:flex-start;font:800 196px/.8 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock .side{display:flex;flex-direction:column;gap:12px;margin:10px 0 0 14px}
.clock .sec{font-size:60px;line-height:.8;color:var(--gold)}
.clock .ap{font-size:40px;line-height:.8;color:var(--smoke)}
.dayname{margin-top:22px;font:800 70px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--gold)}
.datestr{margin-top:6px;font:500 30px/1.2 var(--body);color:var(--ash);opacity:.88}
.facts{margin-top:auto;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.facts h4{margin:0;font:700 16px var(--body);letter-spacing:.26em;color:var(--smoke);text-transform:uppercase}
.fact{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:baseline}
.fact .l{font:700 15px var(--body);letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.fact .v{font:500 23px/1.2 var(--body);color:var(--ash)}

/* main stage */
.main{position:absolute;left:560px;top:0;right:0;bottom:96px;overflow:hidden}
.bgword{position:absolute;right:-30px;bottom:30px;font:900 460px/.8 var(--display);color:transparent;-webkit-text-stroke:2px rgba(245,180,0,.09);white-space:nowrap;text-transform:uppercase;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.segwrap{position:absolute;left:96px;right:96px;top:84px;bottom:118px}
.seg{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}
.seg.out{animation:segout .5s cubic-bezier(.6,0,.8,.4) forwards}
.wipe{position:absolute;top:-10%;left:0;width:34%;height:120%;z-index:20;pointer-events:none;transform:translateX(-140%) skewX(-14deg);
  background:linear-gradient(90deg,transparent,rgba(255,106,26,.85) 30%,var(--gold) 70%,rgba(255,236,170,.9))}
.wipe.go{animation:wipe .8s cubic-bezier(.7,0,.25,1)}
.kick{display:flex;align-items:center;gap:16px;font:700 22px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.kick::before{content:"";width:52px;height:4px;background:var(--flame)}
.kick .n{color:var(--smoke);letter-spacing:.2em}
.h1{margin:30px 0 0;font:900 172px/.86 var(--display);text-transform:uppercase;text-wrap:balance}
.h2{margin:22px 0 0;font:800 104px/.9 var(--display);text-transform:uppercase;text-wrap:balance}
.gold{color:var(--gold)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.04em;margin-bottom:-.04em}
.w>span{display:inline-block}
.seg.in .w>span{animation:up .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--j)*70ms + 180ms)}
.seg.in .k{animation:rise .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i)*90ms + 320ms)}
.foot{margin-top:auto;font:600 20px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}

.chips{position:absolute;left:96px;right:96px;bottom:44px;display:flex;gap:12px}
.chip{flex:1;min-width:0;position:relative;padding-top:16px;font:700 15px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(244,238,229,.12)}
.chip .fill{position:absolute;left:0;top:0;height:4px;width:0;background:var(--gold)}
.chip.on{color:var(--ash)}

/* welcome */
.msg{margin-top:54px;max-width:1000px;padding-left:30px;border-left:6px solid var(--flame);font:600 52px/1.18 var(--body);text-wrap:balance}
.today-line{margin-top:auto;font:600 30px var(--body);color:var(--smoke);letter-spacing:.04em}
.today-line b{color:var(--ash);font-weight:700}

/* houses */
.houses{margin-top:58px;display:flex;flex-direction:column;gap:40px}
.hrow{display:grid;grid-template-columns:96px 1fr 220px;grid-template-rows:auto 26px;column-gap:30px;row-gap:14px;align-items:end}
.hrank{grid-row:1/3;font:900 116px/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--c)}
.hname{display:flex;align-items:center;gap:16px;font:800 58px/1 var(--display);text-transform:uppercase}
.hname svg{width:52px;height:40px;fill:var(--gold);filter:drop-shadow(0 0 12px rgba(245,180,0,.6))}
.hval{grid-row:1/3;grid-column:3;text-align:right;font:900 108px/.8 var(--display);font-variant-numeric:tabular-nums}
.htrack{grid-column:2;height:26px;background:rgba(244,238,229,.07);overflow:hidden}
.hfill{height:100%;width:calc(var(--w)*100%);background-color:var(--c);background-image:linear-gradient(90deg,rgba(11,8,6,.55),rgba(11,8,6,0) 85%);box-shadow:0 0 34px var(--c)}
.seg.in .hfill{animation:grow 1.8s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i)*140ms + 500ms)}

/* sports */
.games{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.game{display:grid;grid-template-columns:140px 1fr auto;gap:36px;align-items:center;padding:18px 28px 18px 0;border-bottom:1px solid var(--line)}
.game.today{border-left:6px solid var(--gold);padding-left:24px;background:linear-gradient(90deg,rgba(245,180,0,.15),transparent 72%)}
.gdate{text-align:center;font-family:var(--display);line-height:.9}
.gdate span{display:block;font:700 20px var(--body);letter-spacing:.22em;color:var(--gold)}
.gdate b{display:block;font-weight:900;font-size:92px}
.gteam{font:800 54px/1 var(--display);text-transform:uppercase}
.gopp{margin-top:8px;font:600 36px/1.1 var(--body);color:var(--gold)}
.gtime{text-align:right;font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.gcd{margin-top:8px;font:600 21px var(--body);letter-spacing:.08em;color:var(--smoke)}
.badge{display:inline-block;margin-top:10px;padding:6px 12px;background:var(--flame);color:#1A0B02;font:800 17px var(--body);letter-spacing:.22em}
.badge.livepulse{animation:pulsebg 1.6s infinite}

/* lunch */
.menu{margin-top:36px;display:flex;flex-direction:column;gap:22px}
.dish{font:900 176px/.85 var(--display);text-transform:uppercase;text-wrap:balance}
.dish.long{font-size:124px}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;margin-top:22px}
.sidei{display:flex;align-items:center;gap:22px;font:700 60px/1 var(--display);text-transform:uppercase}
.sidei::before{content:"";flex:0 0 auto;width:18px;height:18px;background:var(--flame);transform:rotate(45deg)}

/* announcements */
.ann{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:48px;margin-top:10px}
.ann.withimg{grid-template-columns:minmax(0,1fr) 500px}
.ann .h2.s1{font-size:150px}.ann .h2.s2{font-size:112px}.ann .h2.s3{font-size:84px}
.ann p{margin:34px 0 0;font:500 46px/1.3 var(--body);color:var(--ash);opacity:.92;max-width:36ch}
.ann p.small{font-size:36px}
.ann .pic{min-height:0;display:flex;align-items:center}
.ann .pic img{display:block;width:100%;max-height:690px;object-fit:contain;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}

/* shoutouts */
.bday{margin-top:24px;font:900 196px/.82 var(--display);text-transform:uppercase;background:linear-gradient(92deg,var(--gold),var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent}
.bnames{margin-top:30px;font:800 74px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.shouts{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 48px}
.shout{border-top:4px solid var(--gold);padding-top:16px}
.shout b{display:block;font:800 50px/1 var(--display);text-transform:uppercase}
.shout span{display:block;margin-top:10px;font:500 30px/1.3 var(--body);color:var(--ash);opacity:.9}
.confetti{position:absolute;top:-84px;right:-96px;bottom:0;left:-96px;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-40px;width:14px;height:28px;background:var(--c);opacity:.9;animation:fall var(--d) linear infinite;animation-delay:var(--dl)}

/* countdown */
.cd{display:flex;gap:30px;margin-top:64px}
.cd div{flex:1;border-top:4px solid var(--gold);padding-top:20px}
.cd b{display:block;font:900 224px/.84 var(--display);font-variant-numeric:tabular-nums}
.cd span{display:block;margin-top:12px;font:700 22px var(--body);letter-spacing:.3em;color:var(--smoke)}
.more{margin-top:auto;display:flex;gap:44px;flex-wrap:wrap;font:600 28px var(--body);color:var(--smoke)}
.more b{color:var(--ash)}

/* creed */
.creed-by{margin-top:14px;font:600 30px var(--body);color:var(--smoke)}
.creed{margin-top:40px;display:flex;flex-direction:column;gap:12px}
.cl{font:700 62px/1.1 var(--display);color:var(--ash);opacity:.26}
.creed.small .cl{font-size:46px}
.seg.in .cl{animation:lineon var(--t) ease forwards;animation-delay:var(--dl)}

/* ticker */
.ticker{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;background:#050302;border-top:2px solid var(--gold)}
.tlabel{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 64px 0 40px;background:var(--gold);color:#140A03;font:900 42px var(--display);letter-spacing:.06em;clip-path:polygon(0 0,100% 0,calc(100% - 30px) 100%,0 100%)}
.tview{flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ttrack{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;font:600 38px var(--body);animation:crawl 60s linear infinite}
.ttrack .sep{display:inline-block;width:14px;height:14px;margin:0 38px;background:var(--flame);transform:rotate(45deg)}
.ttrack b{color:var(--gold);font-weight:700}

/* paused tag */
.paused{position:absolute;right:96px;top:40px;font:700 16px var(--body);letter-spacing:.24em;color:var(--smoke);text-transform:uppercase}

/* hud */
.hud{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;opacity:0;transition:opacity .3s;pointer-events:none}
body.awake .hud{opacity:1;pointer-events:auto}
.hb{background:rgba(22,17,12,.9);color:var(--ash);border:1px solid var(--edge);border-radius:8px;padding:10px 14px;font:600 14px var(--body);cursor:pointer}
.hb.res{cursor:default;color:var(--smoke)}
.hb.pri{background:var(--gold);color:#140A03;border-color:var(--gold)}
.hb:focus-visible,.btn:focus-visible,.etab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.wx{margin-top:24px;display:flex;align-items:center;gap:18px;min-height:64px}
.wx svg{width:64px;height:64px;flex:0 0 auto}
.wx b{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums}
.wx span{font:500 20px/1.3 var(--body);color:var(--smoke)}
.ycd{margin-top:22px;display:flex;align-items:center;gap:16px;padding:12px 18px;border:1px solid var(--line);background:rgba(245,180,0,.07)}
.ycd b{font:900 66px/.9 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.ycd span{font:700 16px/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
body.locked .facts,body.locked .chips,body.locked .sync,body.locked .wx,body.locked .ycd{visibility:hidden}
.lockform{position:fixed;z-index:55;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1px solid var(--edge);border-radius:10px;background:rgba(22,17,12,.95);opacity:0;transition:opacity .3s}
body.locked .lockform{display:flex}
body.locked.awake .lockform,.lockform:focus-within{opacity:1}
.lockform label{width:100%;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--smoke)}
.lockform input{flex:1 1 220px;min-width:0;background:#1D1711;color:var(--ash);border:1px solid var(--edge);border-radius:7px;padding:10px 12px;font:500 15px var(--body)}
.lockform input:focus{outline:2px solid var(--gold)}
#lockmsg{width:100%;font:500 13px var(--body);color:var(--smoke)}
.ybig{margin-top:22px;display:flex;align-items:flex-end;gap:30px}
.ybig b{font:900 380px/1 var(--display);padding:.05em .02em 0;margin:-.1em 0 -.06em;font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:linear-gradient(180deg,#FFE08A,var(--gold) 45%,var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,106,26,.35))}
.ybig span{padding-bottom:16px;font:800 96px/.9 var(--display);text-transform:uppercase}
.ybig small{display:block;margin-top:14px;font:600 26px/1.2 var(--body);text-transform:none;color:var(--smoke)}
.yrow{display:flex;gap:64px;margin-top:34px}
.yrow b{display:block;font:800 100px/.9 var(--display);font-variant-numeric:tabular-nums}
.yrow span{display:block;margin-top:10px;font:700 18px var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--smoke)}
.ybar{margin-top:auto}
.ytrack{height:16px;background:rgba(244,238,229,.08);overflow:hidden}
.yfill{height:100%;width:calc(var(--p)*100%);background:linear-gradient(90deg,var(--flame),var(--gold));box-shadow:0 0 24px rgba(245,180,0,.6)}
.seg.in .yfill{animation:grow 2s cubic-bezier(.16,.84,.24,1) .6s both}
.ylab{display:flex;justify-content:space-between;gap:20px;margin-top:14px;font:600 20px var(--body);letter-spacing:.06em;color:var(--smoke)}
.ylab b{color:var(--ash)}
.live.stale i{background:var(--smoke);animation:none}
.live.stale{color:var(--smoke)}
.sync{margin-top:8px;font:500 15px var(--body);color:var(--smoke);letter-spacing:.04em}
a.hb{text-decoration:none;display:inline-block}

/* friday champion overlay */
#champ{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;background:#000;overflow:hidden}
#champ .chs{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;overflow:hidden;transform:scale(var(--chz,1))}
#champ canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
#champ .ch-bar{position:absolute;left:0;right:0;height:132px;background:#000;z-index:3;transition:transform 1.4s cubic-bezier(.7,0,.2,1)}
#champ .ch-bar.t{top:0}#champ .ch-bar.b{bottom:0}
#champ.open .ch-bar.t{transform:translateY(-100%)}#champ.open .ch-bar.b{transform:translateY(100%)}
#champ .ch-top{position:absolute;z-index:4;left:0;right:0;top:50px;text-align:center;font:700 24px var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--smoke);opacity:0;transition:opacity 1s}
#champ .ch-top b{color:var(--gold)}
#champ .ch-top.on{opacity:1}
#champ .ch-shade{position:absolute;z-index:2;left:0;right:0;bottom:0;height:420px;pointer-events:none;opacity:0;transition:opacity 1.5s;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
#champ.open .ch-shade{opacity:1}
#champ .ch-title{position:absolute;z-index:4;left:0;right:0;bottom:48px;text-align:center}
#champ .ch-kick{font:700 26px var(--body);letter-spacing:.5em;text-transform:uppercase;color:var(--c2);opacity:0;margin-left:.5em}
#champ .ch-name{margin-top:4px;font:900 156px/.86 var(--display);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
#champ .ch-name span{display:inline-block;opacity:0;transform:translateY(60%) scale(.9);filter:blur(14px);padding:.06em .01em 0;
  background:linear-gradient(180deg,#fff 0%,var(--c2) 45%,var(--c) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#champ .ch-name.on span{animation:chLetterIn .9s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:calc(var(--i)*50ms)}
#champ .ch-meta{margin-top:16px;display:flex;justify-content:center;align-items:center;gap:34px;font:600 28px var(--body);opacity:0;color:var(--ash)}
#champ .ch-meta b{font:800 54px/1 var(--display);color:#fff;font-variant-numeric:tabular-nums}
#champ .ch-meta .sep{width:8px;height:8px;background:var(--c);transform:rotate(45deg)}
#champ .ch-meta .runner{color:var(--smoke);font-size:22px;letter-spacing:.06em}
#champ .ch-meta .runner i{font-style:normal;color:var(--ash)}
#champ .ch-kick.on,#champ .ch-meta.on{animation:chFadeUp 1s cubic-bezier(.16,.84,.24,1) forwards}
@keyframes chFadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes chLetterIn{to{opacity:1;transform:none;filter:none}}

/* showcase overlay: flyers and spotlight photos behind glass */
#show{position:absolute;top:0;right:0;bottom:0;left:0;z-index:35;background:#05040a;overflow:hidden}
#show .sc-box{position:absolute;top:0;right:0;bottom:0;left:0}
#show .sc-bg{position:absolute;top:-6%;left:-6%;width:112%;height:112%;animation:scKen 26s ease-in-out infinite alternate}
#show .sc-bg canvas{width:100%;height:100%;display:block;opacity:.55}
#show .sc-dim{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(70% 70% at 50% 50%,rgba(5,4,10,.25),rgba(5,4,10,.85))}
#show .sc-rays{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:.5;
  background:repeating-conic-gradient(from 0deg,var(--sc-a) 0deg 2deg,transparent 2deg 14deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 8%,transparent 70%);mask-image:radial-gradient(closest-side,#000 8%,transparent 70%);animation:scSpin 90s linear infinite}
#show .sc-halo{position:absolute;left:50%;top:50%;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;
  background:radial-gradient(closest-side,var(--sc-a),transparent 70%);opacity:.35}
#show .sc-stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;gap:90px;perspective:1800px}
#show .sc-frame{position:relative;flex:0 0 auto;padding:16px;border-radius:30px;transform-style:preserve-3d;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 40%,rgba(255,255,255,.12));
  box-shadow:0 0 0 1px rgba(255,255,255,.28),0 70px 140px rgba(0,0,0,.65),0 0 120px var(--sc-a);
  -webkit-box-reflect:below 18px linear-gradient(transparent 74%,rgba(255,255,255,.2));
  animation:scIn 1.5s cubic-bezier(.16,.84,.24,1) both,scFloat 12s ease-in-out 1.5s infinite}
#show .sc-frame img{display:block;border-radius:18px;width:100%;height:100%;object-fit:cover}
#show .sc-gloss{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:30px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 26%),radial-gradient(120% 50% at 50% -12%,rgba(255,255,255,.22),transparent 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.18)}
#show .sc-sheen{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:30px;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(112deg,transparent 32%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.65) 49%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.65) 51%,rgba(255,255,255,.05) 58%,transparent 68%);
  background-size:320% 100%;background-position:160% 0;animation:scSheen 6.5s cubic-bezier(.45,0,.2,1) 1.1s infinite}
#show .sc-sheen.b{background:linear-gradient(112deg,transparent 44%,rgba(255,255,255,.25) 50%,transparent 56%);background-size:320% 100%;animation-delay:1.45s}
#show .sc-text{flex:0 1 760px;min-width:0}
#show .sc-kick{display:flex;align-items:center;gap:16px;font:700 26px var(--body);letter-spacing:.38em;text-transform:uppercase;color:var(--gold);opacity:0}
#show .sc-kick::before{content:"";width:56px;height:4px;background:var(--sc-a)}
#show .sc-name{margin-top:22px;font:900 150px/.86 var(--display);text-transform:uppercase;color:#fff;text-wrap:balance;opacity:0;
  text-shadow:0 0 50px var(--sc-a)}
#show .sc-name.m{font-size:110px}#show .sc-name.s{font-size:84px}
#show .sc-note{margin-top:34px;max-width:28ch;font:500 40px/1.3 var(--body);color:var(--ash);opacity:0}
#show.go .sc-kick{animation:scUp .9s cubic-bezier(.16,.84,.24,1) .7s forwards}
#show.go .sc-name{animation:scName 1.1s cubic-bezier(.16,.84,.24,1) .9s forwards}
#show.go .sc-note{animation:scUp .9s cubic-bezier(.16,.84,.24,1) 1.3s forwards}
#show .sc-spark{position:absolute;width:10px;height:10px;opacity:0;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:scTwinkle var(--d) ease-in-out var(--dl) infinite}
#show .sc-flash{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(60% 60% at 50% 50%,rgba(255,255,255,.55),transparent 70%);opacity:0;mix-blend-mode:screen}
#show.go .sc-flash{animation:scFlash 1.2s ease-out .55s}
@keyframes scKen{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
@keyframes scSpin{to{transform:rotate(360deg)}}
@keyframes scIn{from{opacity:0;transform:translateZ(-700px) rotateX(24deg) rotateY(-22deg);filter:blur(18px)}to{opacity:1;transform:none;filter:none}}
@keyframes scFloat{0%,100%{transform:none}25%{transform:rotateY(5deg) rotateX(1.5deg) translateY(-10px)}75%{transform:rotateY(-5deg) rotateX(-1.5deg) translateY(6px)}}
@keyframes scSheen{0%{background-position:160% 0}30%,100%{background-position:-60% 0}}
@keyframes scUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes scName{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes scTwinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes scFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#show *{animation:none!important;opacity:1!important}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,31,.7)}70%{box-shadow:0 0 0 14px rgba(255,59,31,0)}100%{box-shadow:0 0 0 0 rgba(255,59,31,0)}}
@keyframes pulsebg{50%{background:var(--gold)}}
@keyframes up{from{transform:translateY(108%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(54px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes segout{to{opacity:0;transform:translateY(-40px);filter:blur(12px)}}
@keyframes wipe{from{transform:translateX(-140%) skewX(-14deg)}to{transform:translateX(420%) skewX(-14deg)}}
@keyframes grow{from{width:0}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lineon{0%{opacity:1;color:var(--gold);transform:translateX(18px)}12%{transform:none}80%{color:var(--gold);opacity:1}100%{color:var(--ash);opacity:.92}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(1150px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .seg.in .k,.seg.in .w>span,.seg.in .hfill,.seg.out,.wipe.go,.bgword,.confetti i,.live i,.badge.livepulse{animation:none!important}
  .seg.in .cl{animation:none;opacity:.92}
  .ttrack{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CROWN='<svg viewBox="0 0 52 40" aria-hidden="true"><path d="M2 10l12 10L26 2l12 18 12-10-5 26H7z"/></svg>';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pday(s){if(!s)return null;var a=String(s).split('-').map(Number);if(a.length<3||!a[0])return null;return new Date(a[0],a[1]-1,a[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtTime(t){if(!t)return'';var a=String(t).split(':').map(Number);var h=a[0],m=a[1]||0;var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap}
function fmtRange(a,b){if(!a)return'';if(!b)return fmtTime(a);var A=fmtTime(a),B=fmtTime(b);if(A.slice(-2)===B.slice(-2))A=A.slice(0,-3);return A+' – '+B}
function at(date,time){var d=pday(date);if(!d)return null;if(time){var a=time.split(':').map(Number);d.setHours(a[0],a[1]||0,0,0)}return d}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function fmtNum(n){return (Math.round(n*10)/10).toString()}
function safeColor(c){return /^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:'#F5B400'}
function shortDate(s){var d=pday(s);return d?MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate():''}
function words(t){return String(t||'').trim().split(/\s+/).filter(Boolean).length}
function split(text,start){var j=start||0;return String(text||'').split(/\s+/).filter(Boolean).map(function(w){return '<span class="w"><span style="--j:'+(j++)+'">'+esc(w)+'</span></span>'}).join(' ')}
function clean(a){return (a||[]).map(function(x){return String(x).trim()}).filter(Boolean)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}

/* ---------- data ---------- */
function normalize(d){
  d=d||{};
  d.settings=Object.assign({welcome:'Welcome to RISE Academy',seconds:12,autoTicker:true,lastDay:'2027-05-27',firstDay:'2026-08-17',segments:{}},d.settings||{});
  d.settings.segments=Object.assign({spot:true,champ:true,year:true,welcome:true,creed:true,houses:true,sports:true,lunch:true,ann:true,shout:true,count:true},d.settings.segments||{});
  ['messages','houses','games','lunch','announcements','shoutouts','countdowns','ticker','spotlight'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});
  d.creed=Object.assign({title:'',author:'',lines:[]},d.creed||{});
  if(!Array.isArray(d.creed.lines))d.creed.lines=[];
  d.housesUpdated=d.housesUpdated||'';
  return d;
}
var S=normalize({});

function todayMsg(t){var m=S.messages.filter(function(x){return x.text&&(x.date===t||!x.date)});m.sort(function(a,b){return (b.date?1:0)-(a.date?1:0)});return m[0]||null}
function upcomingGames(now){
  var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),lim=addDays(t0,8);
  return S.games.filter(function(g){
    var st=at(g.date,g.start);if(!st||!g.team)return false;
    var d=pday(g.date);if(d<t0||d>=lim)return false;
    var en=g.end?at(g.date,g.end):new Date(st.getTime()+2*36e5);
    return en>now;
  }).sort(function(a,b){return at(a.date,a.start)-at(b.date,b.start)});
}
function lunchFor(now){
  var t=ymd(now),cut=now.getHours()*60+now.getMinutes()>=13*60+30;
  if(!cut){var e=S.lunch.find(function(l){return l.date===t&&clean(l.items).length});return e?{when:'Today',items:clean(e.items)}:null}
  for(var i=1;i<=4;i++){var d=addDays(now,i),k=ymd(d);var f=S.lunch.find(function(l){return l.date===k&&clean(l.items).length});
    if(f)return {when:i===1?'Tomorrow':DAYS[d.getDay()],items:clean(f.items)}}
  return null;
}
/* private pictures: fetched once per page load from the service, kept in memory only */
var IMGS={};
function imageSrc(ref){
  if(!ref)return null;var th=String(ref).match(/drive\.google\.com\/thumbnail\?id=([\w-]+)/);if(th)ref='drive:'+th[1];
  if(/^https:\/\//.test(ref))return ref;var m=String(ref).match(/^drive:([\w-]+)$/);if(!m||!CONN)return null;
  var e=IMGS[m[1]];if(!e||(e.st==='err'&&Date.now()-e.at>300000)){loadImg(m[1]);return null}return e.st==='ok'?e.url:null;
}
function loadImg(id){
  IMGS[id]={st:'l'};
  fetch('https://script.google.com/macros/s/'+CONN.id+'/exec?k='+encodeURIComponent(CONN.key)+'&img='+encodeURIComponent(id),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'})
   .then(function(r){return r.json()}).then(function(j){IMGS[id]=j&&j.ok===true&&/^image\//.test(j.type)?{st:'ok',url:'data:'+j.type+';base64,'+j.data}:{st:'err',at:Date.now(),why:(j&&j.error)||(j&&j.ok===false?'screen key rejected':'the service did not return a picture (is the new Code.gs deployed?)')};showRes()})
   .catch(function(){IMGS[id]={st:'err',at:Date.now(),why:'could not reach the service'};showRes()});
}
function imgFailed(ref){var m=String(ref||'').match(/(?:^drive:|thumbnail\?id=)([\w-]+)/);return !!(m&&IMGS[m[1]]&&IMGS[m[1]].st==='err')}
function activeSpots(t){return S.spotlight.filter(function(s){return s.name&&(!s.start||s.start<=t)&&(!s.end||s.end>=t)})}
function rSpot(el,s){el.innerHTML='<div class="kick k">'+esc(s.title||'Spotlight')+'</div><h1 class="h1">'+split(s.name)+'</h1>'+(s.note?'<div class="msg k">'+esc(s.note)+'</div>':'')}
function activeAnns(t){return S.announcements.filter(function(a){return (a.title||a.body||a.image)&&(!a.start||a.start<=t)&&(!a.end||a.end>=t)})}
function shoutsFor(t){return S.shoutouts.filter(function(s){return s.name&&(!s.date||s.date===t)})}
function nextCountdowns(now){var t=ymd(now);return S.countdowns.filter(function(c){return c.label&&c.date&&c.date>t}).sort(function(a,b){return a.date<b.date?-1:1})}
function rankedHouses(){return S.houses.filter(function(h){return h.name}).slice().sort(function(a,b){return num(b.points)-num(a.points)})}

/* ---------- secure connection (no data, no Sheet, no service address in this file) ---------- */
var LKEY='rise-live-screen',CKEY='rise-live-cache',SETUP_RE=/[#&]?s=([A-Za-z0-9_-]{20,})~([A-Za-z0-9]{48,})/;
function storeConn(c){try{localStorage.setItem(LKEY,JSON.stringify(c))}catch(e){}}
function readConn(){
  var m=(location.hash||'').match(SETUP_RE);
  if(m){var c={id:m[1],key:m[2]};storeConn(c);
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
    return c}
  try{var c2=JSON.parse(localStorage.getItem(LKEY)||'null');return c2&&c2.id&&c2.key?c2:null}catch(e){return null}
}
var CONN=readConn(),locked=true,lastSync=0,WX=null,dataKey='';
function forget(){CONN=null;try{localStorage.removeItem(LKEY);localStorage.removeItem(CKEY)}catch(e){}S=normalize({});WX=null;dataKey='';setLocked(true)}
function setLocked(on){
  var was=locked;locked=on;document.body.classList.toggle('locked',on);
  if(on){$('#facts').innerHTML='';$('#tt').innerHTML='';tickerKey=''}
  if(was!==on){renderFacts();renderTicker();renderWeather();renderYear();renderSync();tick(true)}
}
function applyData(d){var k=JSON.stringify(d);if(k===dataKey)return;dataKey=k;S=d;renderFacts();renderTicker();renderYear();tick(true)}
function sync(){
  if(!CONN){setLocked(true);return}
  var u='https://script.google.com/macros/s/'+CONN.id+'/exec?k='+encodeURIComponent(CONN.key)+'&_='+Date.now();
  fetch(u,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok===false){forget();lockMsg('This setup link is not valid anymore. Create a new one from the Sheet: RISE Live > Add a screen.');return}
    if(!j||j.ok!==true){lockMsg('The service answered, but not with screen data. Check the deployment.');return}
    lastSync=Date.now();WX=j.weather||null;var d=normalize(j.data||{});
    try{localStorage.setItem(CKEY,JSON.stringify({at:lastSync,data:d,weather:WX}))}catch(e){}
    lockMsg('');setLocked(false);applyData(d);renderWeather();renderSync();
  }).catch(function(){renderSync();if(locked)lockMsg('Could not reach the service. In Apps Script, the web app must be deployed with access: Anyone. Then create a new setup link.')});
}
function lockMsg(t){var m=$('#lockmsg');if(m)m.textContent=t}
function renderSync(){
  var el=$('#sync');if(!el)return;
  var fresh=lastSync&&Date.now()-lastSync<5*6e4;
  $('.live').classList.toggle('stale',!fresh);
  el.textContent=locked?'':fresh?'Updated '+fmtClock(new Date(lastSync)):lastSync?'Offline · last update '+fmtClock(new Date(lastSync)):'Connecting…';
}
function fmtClock(d){var h=d.getHours()%12||12;return h+':'+pad(d.getMinutes())+' '+(d.getHours()>=12?'PM':'AM')}
function loadCache(){
  if(!CONN){try{localStorage.removeItem(CKEY)}catch(e){}return}
  try{var c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c&&c.data){S=normalize(c.data);WX=c.weather||null;lastSync=c.at||0;dataKey=JSON.stringify(S);locked=false}}catch(e){}
}

/* ---------- weather ---------- */
var WXI={
 sun:'<circle cx="32" cy="32" r="12" fill="#F5B400"/><g stroke="#F5B400" stroke-width="4" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>',
 moon:'<path d="M40 8a24 24 0 1 0 16 38A20 20 0 0 1 40 8z" fill="#F4EEE5"/>',
 cloud:'<path d="M18 50h30a11 11 0 0 0 0-22 15 15 0 0 0-29-3A12.5 12.5 0 0 0 18 50z" fill="#F4EEE5"/>',
 partly:'<circle cx="24" cy="22" r="10" fill="#F5B400"/><g stroke="#F5B400" stroke-width="3.5" stroke-linecap="round"><path d="M24 4v5M6 22h5M11 9l3.5 3.5M37 9l-3.5 3.5"/></g><path d="M20 54h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11.5 11.5 0 0 0 20 54z" fill="#F4EEE5"/>',
 rain:'<path d="M18 40h30a11 11 0 0 0 0-22 15 15 0 0 0-29-3A12.5 12.5 0 0 0 18 40z" fill="#F4EEE5"/><g stroke="#5AB4FF" stroke-width="4" stroke-linecap="round"><path d="M22 47l-3 8M34 47l-3 8M46 47l-3 8"/></g>',
 snow:'<path d="M18 40h30a11 11 0 0 0 0-22 15 15 0 0 0-29-3A12.5 12.5 0 0 0 18 40z" fill="#F4EEE5"/><g fill="#CFE8FF"><circle cx="21" cy="50" r="3.5"/><circle cx="33" cy="54" r="3.5"/><circle cx="45" cy="50" r="3.5"/></g>',
 storm:'<path d="M18 40h30a11 11 0 0 0 0-22 15 15 0 0 0-29-3A12.5 12.5 0 0 0 18 40z" fill="#F4EEE5"/><path d="M34 40l-8 12h7l-4 10 12-15h-7l4-7z" fill="#F5B400"/>',
 fog:'<g stroke="#F4EEE5" stroke-width="5" stroke-linecap="round"><path d="M10 24h44M16 34h38M10 44h40"/></g>'
};
function wxKind(c,day){
  if(c===0)return [day?'sun':'moon',day?'Sunny':'Clear'];
  if(c===1)return [day?'partly':'moon',day?'Mostly sunny':'Mostly clear'];
  if(c===2)return ['partly','Partly cloudy'];
  if(c===3)return ['cloud','Cloudy'];
  if(c===45||c===48)return ['fog','Fog'];
  if(c>=51&&c<=57)return ['rain','Drizzle'];
  if((c>=61&&c<=67)||(c>=80&&c<=82))return ['rain',c>=80?'Showers':'Rain'];
  if((c>=71&&c<=77)||c===85||c===86)return ['snow','Snow'];
  if(c>=95)return ['storm','Thunderstorms'];
  return ['cloud','Cloudy'];
}
function renderWeather(){
  var el=$('#wx');if(!el)return;
  if(locked||!WX||typeof WX.temp!=='number'){el.innerHTML='';return}
  var k=WX.kind&&WXI[WX.kind]?[WX.kind,WX.text||wxKind(WX.code,WX.day)[1]]:wxKind(WX.code,WX.day);
  el.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true">'+WXI[k[0]]+'</svg><b>'+WX.temp+'°F</b><span>'+esc(k[1])+'<br>H '+WX.hi+'° · L '+WX.lo+'°</span>';
}
function renderYear(){
  var el=$('#ycd');if(!el)return;
  var d=locked?null:pday(S.settings.lastDay),n=d?daysUntil(S.settings.lastDay):-1;
  if(n<0||isNaN(n)){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=n===0?'<b>0</b><span>Last day<br>of school!</span>':'<b>'+n+'</b><span>day'+(n===1?'':'s')+' until the<br>last day of school</span>';
}

/* ---------- playlist ---------- */
function playlist(now){
  if(locked)return [{key:'lock',label:'RISE Live',word:'RISE',dur:3600,render:rLock}];
  var on=S.settings.segments,base=Math.max(5,num(S.settings.seconds)||12),t=ymd(now),out=[];
  if(on.welcome)out.push({key:'welcome',label:'Welcome',word:'RISE',dur:base,render:rWelcome});
  var ch=champHouses();
  if(on.champ&&ch&&(FORCE_CHAMP||now.getDay()===5))out.push({key:'champ',label:'Champion',word:'CHAMPION',dur:26,render:rChamp});
  var yd=pday(S.settings.lastDay)?daysUntil(S.settings.lastDay):-1;
  if(on.year&&yd>=0)out.push({key:'year',label:'Last Day',word:'SUMMER',dur:base+2,render:rYear});
  var cl=S.creed.lines.filter(function(x){return String(x).trim()});
  if(on.creed&&cl.length)out.push({key:'creed',label:'Creed',word:'CREED',dur:Math.max(base,cl.length*3.4+4),render:rCreed});
  if(on.houses&&rankedHouses().length)out.push({key:'houses',label:'House Points',word:'HOUSES',dur:base+2,render:rHouses});
  if(on.sports&&upcomingGames(now).length)out.push({key:'sports',label:'Sports',word:'GAME DAY',dur:base+2,render:rSports});
  if(on.lunch&&lunchFor(now))out.push({key:'lunch',label:'Lunch',word:'LUNCH',dur:base,render:rLunch});
  if(on.ann){var an=activeAnns(t);an.forEach(function(a,i){
    var src=imageSrc(a.image),txt=!!(a.title||a.body);
    if(src)out.push({key:'ann',sub:i,overlay:true,label:'Announcements',word:'NEWS',dur:txt?Math.max(base+4,words(a.title+' '+a.body)*0.5+8):16,
      render:function(el){el.innerHTML='';Showcase.start({src:src,kicker:txt?'Announcement'+(an.length>1?' · '+(i+1)+' of '+an.length:''):'',title:a.title,note:a.body})}});
    else if(txt)out.push({key:'ann',sub:i,label:'Announcements',word:'NEWS',dur:Math.max(base,words(a.title+' '+a.body)*0.5+5),render:function(el){rAnn(el,{title:a.title,body:a.body},i,an.length)}});
  })}
  if(on.spot)activeSpots(t).forEach(function(s,i){var src=imageSrc(s.photo);
    if(src)out.push({key:'spot',sub:i,overlay:true,label:'Spotlight',word:'PROUD',dur:15,render:function(el){el.innerHTML='';Showcase.start({src:src,kicker:s.title||'Spotlight',title:s.name,note:s.note,spotlight:true})}});
    else if(!s.photo||imgFailed(s.photo))out.push({key:'spot',sub:i,label:'Spotlight',word:'PROUD',dur:base,render:function(el){rSpot(el,s)}});
  });
  if(on.shout&&shoutsFor(t).length)out.push({key:'shout',label:'Shoutouts',word:'SHOUT',dur:base+2,render:rShout});
  if(on.count&&nextCountdowns(now).length)out.push({key:'count',label:'Countdown',word:'SOON',dur:base,render:rCount});
  return out;
}

/* ---------- segment renderers ---------- */
function stag(el){$$('.k',el).forEach(function(n,i){n.style.setProperty('--i',i)})}
function greet(now){var h=now.getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function rLock(el){
  el.innerHTML='<div class="kick k">RISE Live</div><h1 class="h1" style="font-size:140px">'+split('Screen not activated')+'</h1><div class="msg k" style="font-size:38px">Open this screen’s setup link to activate it.</div>';
}
function rYear(el){
  var last=pday(S.settings.lastDay),first=pday(S.settings.firstDay),n=daysUntil(S.settings.lastDay),now=new Date();
  var p=first&&last&&last>first?Math.max(0,Math.min(1,(now-first)/(last-first))):0,pct=Math.round(p*100);
  var when=DAYS[last.getDay()]+', '+MONTHS[last.getMonth()]+' '+last.getDate()+', '+last.getFullYear();
  if(n===0){el.innerHTML='<div class="kick k">Countdown to the last day of school</div><h1 class="h1">'+split('Last day of school!')+'</h1><div class="msg k">Have a great summer, RISE.</div>';return}
  el.innerHTML='<div class="kick k">Countdown to the last day of school</div>'+
   '<div class="ybig k"><b data-ycd="d">'+n+'</b><span>Day'+(n===1?'':'s')+'<small>'+esc(when)+'</small></span></div>'+
   '<div class="yrow k"><div><b data-ycd="h">00</b><span>Hours</span></div><div><b data-ycd="m">00</b><span>Minutes</span></div><div><b data-ycd="s">00</b><span>Seconds</span></div></div>'+
   (first?'<div class="ybar k"><div class="ytrack"><div class="yfill" style="--p:'+p.toFixed(4)+'"></div></div><div class="ylab"><span>'+shortDate(S.settings.firstDay)+' · First day</span><b>'+pct+'% of the school year done</b><span>'+shortDate(S.settings.lastDay)+' · Last day</span></div></div>':'');
  updateLive();
}
var FORCE_CHAMP=/[?&]champion(=|&|$)/.test(location.search);
function champHouses(){
  var r=rankedHouses().slice(0,3);if(r.length<2||num(r[0].points)<=num(r[1].points))return null;
  return r.map(function(h){return {name:h.name,points:num(h.points),color:safeColor(h.color)}});
}
function weekLabel(d){var mon=addDays(d,-((d.getDay()+6)%7)),fri=addDays(mon,4),m=function(x){return MONTHS[x.getMonth()].slice(0,3)};
  return 'Friday · <b>House of the Week</b> · '+m(mon)+' '+mon.getDate()+' – '+(fri.getMonth()===mon.getMonth()?'':m(fri)+' ')+fri.getDate()}
function rChamp(el){el.innerHTML='';var hs=champHouses();if(!hs)return;
  // keep the Sheet's order so each house always flies in the same lane
  var order=S.houses.map(function(h){return h.name});hs.sort(function(a,b){return order.indexOf(a.name)-order.indexOf(b.name)});
  Champion.start(hs,weekLabel(new Date()))}
function rWelcome(el){
  var now=new Date(),m=todayMsg(ymd(now));
  el.innerHTML='<div class="kick k">'+greet(now)+', RISE</div>'+
    '<h1 class="h1">'+split(S.settings.welcome||'Welcome to RISE Academy')+'</h1>'+
    (m?'<div class="msg k">'+esc(m.text)+'</div>':'')+
    '<div class="today-line k">Today is <b>'+DAYS[now.getDay()]+', '+MONTHS[now.getMonth()]+' '+now.getDate()+'</b></div>';
}
function rCreed(el){
  var lines=S.creed.lines.filter(function(x){return String(x).trim()}),step=3.4;
  el.innerHTML='<div class="kick k">RISE Creed <span class="n">· Stand and recite</span></div>'+
    (S.creed.title?'<h2 class="h2" style="font-size:88px">'+split(S.creed.title)+'</h2>':'')+
    (S.creed.author?'<div class="creed-by k">'+esc(S.creed.author)+'</div>':'')+
    '<div class="creed'+(lines.length>7?' small':'')+'">'+lines.map(function(l,i){return '<div class="cl" style="--dl:'+(1.2+i*step)+'s;--t:'+step+'s">'+esc(l)+'</div>'}).join('')+'</div>';
}
function rHouses(el){
  var hs=rankedHouses(),max=Math.max.apply(null,hs.map(function(h){return num(h.points)}).concat([1]));
  var lead=hs.length>1?num(hs[0].points)-num(hs[1].points):0;
  var head=hs.length>1?(lead>0?split(hs[0].name)+' <span class="gold">'+split('leads by '+fmtNum(lead),words(hs[0].name))+'</span>':split('Tied at the top')):split(hs[0].name);
  el.innerHTML='<div class="kick k">House Points</div><h2 class="h2">'+head+'</h2>'+
    '<div class="houses">'+hs.map(function(h,i){var p=num(h.points);
      return '<div class="hrow k" style="--c:'+safeColor(h.color)+';--w:'+(p/max).toFixed(4)+'">'+
      '<div class="hrank">'+(i+1)+'</div><div class="hname">'+esc(h.name)+(i===0&&lead>0?CROWN:'')+'</div>'+
      '<div class="htrack"><div class="hfill" style="--i:'+i+'"></div></div><div class="hval" data-count="'+p+'">'+fmtNum(p)+'</div></div>'}).join('')+'</div>'+
    (S.housesUpdated?'<div class="foot k">Standings as of '+shortDate(S.housesUpdated)+'</div>':'');
  countUp(el);
}
function rSports(el){
  var now=new Date(),t=ymd(now),gs=upcomingGames(now).slice(0,4),nToday=gs.filter(function(g){return g.date===t}).length;
  var head=nToday?(nToday+' game'+(nToday>1?'s':'')+' today'):('Next up: '+DAYS[pday(gs[0].date).getDay()]);
  el.innerHTML='<div class="kick k">'+(nToday?'Game Day':'This Week in Sports')+'</div><h2 class="h2">'+split(head)+'</h2>'+

function on(id){var e=document.getElementById(id);e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
var timers=[];

function count(){var b=document.querySelector('#chMeta b[data-to]'),to=+b.dataset.to,s=performance.now();
  (function f(n){var p=Math.min(1,(n-s)/1400);p=1-Math.pow(1-p,3);b.textContent=(to*p).toFixed(1);if(p<1)requestAnimationFrame(f)})(s)}
function play(){
  ROCK=null;
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);ROOT.classList.remove('open');
  ['chTop','chKick','chName','chMeta'].forEach(function(id){document.getElementById(id).classList.remove('on')});
  setup();
  var ranked=HOUSES.slice().sort(function(a,b){return b.points-a.points}),h=ranked[0];
  document.getElementById('chName').innerHTML=h.name.split('').map(function(ch,i){return '<span style="--i:'+i+'">'+(ch===' '?'&nbsp;':ch.replace(/[&<>]/g,''))+'</span>'}).join('');
  var lead=Math.round((h.points-ranked[1].points)*10)/10;
  document.getElementById('chMeta').innerHTML='<span><b data-to="'+h.points+'">0</b> points</span><span class="sep"></span><span>won by <b>'+lead+'</b></span><span class="sep"></span>'+
    '<span class="runner">2nd <i>'+ranked[1].name+'</i> '+ranked[1].points+' · 3rd <i>'+ranked[2].name+'</i> '+ranked[2].points+'</span>';
  t0=performance.now();last=0;timers.push(setTimeout(function(){on('chTop')},600));
  strikeAt(rnd(500,1400),400,true);   // opening thunderclap
  raf=requestAnimationFrame(frame);
}

/* ---------- Showcase: flyers and spotlight photos presented behind glass ---------- */
var Showcase=(function(){
  var ROOT=null,curSrc='';
  function esc2(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function build(){
    ROOT=document.createElement('div');ROOT.id='show';ROOT.hidden=true;
    ROOT.innerHTML='<div class="sc-box"><div class="sc-bg"><canvas width="96" height="54"></canvas></div><div class="sc-halo"></div><div class="sc-rays"></div><div class="sc-dim"></div>'+
      '<div class="sc-sparks"></div><div class="sc-stage"></div><div class="sc-flash"></div></div>';
    document.getElementById('stage').appendChild(ROOT);
  }
  // average colour of the picture becomes the glow and light colour
  function paint(img){
    var c=ROOT.querySelector('.sc-bg canvas'),g=c.getContext('2d'),iw=img.naturalWidth,ih=img.naturalHeight,s=Math.max(96/iw,54/ih);
    g.clearRect(0,0,96,54);g.drawImage(img,(96-iw*s)/2,(54-ih*s)/2,iw*s,ih*s);
    var d=g.getImageData(0,0,96,54).data,r=0,gg=0,b=0,n=0;for(var i=0;i<d.length;i+=16){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}
    r=r/n;gg=gg/n;b=b/n;var mx=Math.max(r,gg,b,1),k=200/mx;   // brighten to a usable accent
    ROOT.style.setProperty('--sc-a','rgba('+Math.min(255,r*k|0)+','+Math.min(255,gg*k|0)+','+Math.min(255,b*k|0)+',.55)');
  }
  function sparks(on){
    var box=ROOT.querySelector('.sc-sparks');box.innerHTML='';if(!on)return;var h='';
    for(var i=0;i<34;i++)h+='<i class="sc-spark" style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+'%;--d:'+(2+Math.random()*3).toFixed(1)+'s;--dl:-'+(Math.random()*4).toFixed(1)+'s;transform:scale('+(.5+Math.random()).toFixed(2)+')"></i>';
    box.innerHTML=h;
  }
  /* opts: {src, kicker, title, note, spotlight} — no title/note = the image alone, as big as possible */
  function start(opts){
    if(!ROOT)build();
    var img=new Image();
    img.onload=function(){
      var text=!!(opts.title||opts.note),a=img.naturalWidth/img.naturalHeight;
      var maxH=text?(opts.spotlight?760:820):940,maxW=text?820:1560,h=maxH,w=h*a;if(w>maxW){w=maxW;h=w/a}
      var t=opts.title||'',sz=t.length>26?' s':t.length>14?' m':'';
      var stage=ROOT.querySelector('.sc-stage');
      stage.innerHTML='<div class="sc-frame" style="width:'+Math.round(w+32)+'px;height:'+Math.round(h+32)+'px"><img alt="'+esc2(opts.title||opts.kicker||'Announcement')+'" src="'+esc2(opts.src)+'"><i class="sc-gloss"></i><i class="sc-sheen"></i><i class="sc-sheen b"></i></div>'+
        (text?'<div class="sc-text">'+(opts.kicker?'<div class="sc-kick">'+esc2(opts.kicker)+'</div>':'')+(t?'<div class="sc-name'+sz+'">'+esc2(t)+'</div>':'')+(opts.note?'<div class="sc-note">'+esc2(opts.note)+'</div>':'')+'</div>':'');
      paint(img);sparks(!!opts.spotlight);
      ROOT.classList.remove('go');void ROOT.offsetWidth;ROOT.classList.add('go');ROOT.hidden=false;
    };
    curSrc=opts.src;img.src=opts.src;
  }
  function stop(){if(!ROOT||ROOT.hidden)return;ROOT.hidden=true;ROOT.classList.remove('go');ROOT.querySelector('.sc-stage').innerHTML='';curSrc=''}
  return {start:start,stop:stop,active:function(){return !!ROOT&&!ROOT.hidden}};
})();

function fit(){
  // zoom (not transform) makes the browser draw text and shapes at the TV's real resolution, so 4K stays sharp
  // The stage keeps 1080 design-pixels of height (or 1920 of width) and grows the other way,
  // so it fills any screen shape with no bars on the sides or top.
  var a=innerWidth/innerHeight,W=Math.max(1920,Math.round(1080*a)),H=Math.max(1080,Math.round(1920/a));
  stage.style.width=W+'px';stage.style.height=H+'px';
  var s=Math.min(innerWidth/W,innerHeight/H);
  if('zoom' in document.documentElement.style){stage.style.zoom=s;stage.style.transform=''}
  else{stage.style.zoom='';stage.style.transform='scale('+s+')';stage.style.transformOrigin='center'}
}

  r.textContent='Drawing at '+Math.round(innerWidth*d)+'×'+Math.round(innerHeight*d)+((ok||bad.length)?' · Pictures: '+ok+' ok'+(bad.length?', '+bad.length+' failed ('+bad[0]+')':''):'')}

function tickClock(){
  var n=new Date(),h=n.getHours()%12||12;
  $('#hm').textContent=h+':'+pad(n.getMinutes());$('#ss').textContent=pad(n.getSeconds());$('#ap').textContent=n.getHours()>=12?'PM':'AM';
  $('#dn').textContent=DAYS[n.getDay()];$('#ds').textContent=MONTHS[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear();
}
function renderFacts(){
  var now=new Date(),t=ymd(now),f=[],l=lunchFor(now),g=upcomingGames(now)[0],hs=rankedHouses(),c=nextCountdowns(now)[0];
  if(l)f.push(['Lunch'+(l.when==='Today'?'':' · '+l.when.slice(0,3)),l.items[0]+(l.items.length>1?' + '+(l.items.length-1)+' more':'')]);
  if(g)f.push(['Next game',g.team+' '+(g.home?'vs ':'@ ')+(g.opponent||'TBA')+' · '+(g.date===t?'':DAYS[pday(g.date).getDay()].slice(0,3)+' ')+fmtTime(g.start)]);
  if(hs.length)f.push(['Leading',hs[0].name+' · '+fmtNum(num(hs[0].points))]);
  if(c)f.push(['Coming up',c.label+' in '+daysUntil(c.date)+' day'+(daysUntil(c.date)===1?'':'s')]);
  if(locked)f=[];
  $('#facts').innerHTML=f.length?'<h4>Today at RISE</h4>'+f.map(function(x){return '<div class="fact"><div class="l">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>'}).join(''):'';
}
var tickerKey='';
var tickerTimer=null;
function renderTicker(){
  if(locked){$('#tt').innerHTML='';tickerKey='';return}
  var now=new Date(),t=ymd(now),items=S.ticker.filter(function(x){return String(x).trim()}).map(esc);
  if(S.settings.autoTicker){
    upcomingGames(now).filter(function(g){return g.date===t}).forEach(function(g){items.push('<b>Today:</b> '+esc(g.team)+' '+(g.home?'vs ':'@ ')+esc(g.opponent||'TBA')+', '+fmtTime(g.start))});
    var b=shoutsFor(t).filter(function(s){return s.kind==='birthday'});if(b.length)items.push('<b>Happy birthday</b> '+b.map(function(x){return esc(x.name)}).join(', ')+'!');
    var hs=rankedHouses();if(hs.length)items.push('<b>House race:</b> '+hs.map(function(h){return esc(h.name)+' '+fmtNum(num(h.points))}).join('  ·  '));
    var l=lunchFor(now);if(l)items.push('<b>'+esc(l.when)+'’s lunch:</b> '+esc(l.items.join(', ')));
    activeAnns(t).forEach(function(a){if(a.title)items.push('<b>'+esc(a.title)+'</b>')});
    activeSpots(t).forEach(function(s){items.push('<b>'+esc(s.title||'Spotlight')+':</b> '+esc(s.name))});
    var ydd=pday(S.settings.lastDay),ydn=ydd?Math.floor((ydd-now)/864e5):-1;if(ydn>0)items.push('<b>'+ydn+' day'+(ydn===1?'':'s')+'</b> until the last day of school');
    nextCountdowns(now).slice(0,2).forEach(function(c){var d=daysUntil(c.date);items.push('<b>'+d+' day'+(d===1?'':'s')+'</b> until '+esc(c.label))});
  }
  if(!items.length)items=['<b>RISE Academy</b> · Rantoul, Illinois'];
  var key=items.join('|');if(key===tickerKey)return;tickerKey=key;
  var tt=$('#tt');clearInterval(tickerTimer);
  if(RM){var i=0;tt.style.position='static';tt.innerHTML=items[0];tickerTimer=setInterval(function(){i=(i+1)%items.length;tt.innerHTML=items[i]},7000);return}
  var one=items.map(function(x){return '<span>'+x+'</span><span class="sep"></span>'}).join('');
  tt.innerHTML=one+one;
  requestAnimationFrame(function(){var w=tt.scrollWidth/2;tt.style.animationDuration=Math.max(20,w/130)+'s'});
}

/* ---------- player (every screen follows the wall clock, so all screens stay in step) ---------- */
var list=[],idx=-1,curStart=0,segDur=12000,paused=false,pausedAt=0,offset=0,offT=null,cur=null,swapT=null;
function renderChips(){
  var keys=[],labels={};list.forEach(function(s){if(keys.indexOf(s.key)<0){keys.push(s.key);labels[s.key]=s.label}});
  $('#chips').innerHTML=locked?'':keys.map(function(k){return '<div class="chip'+(cur&&cur.key===k?' on':'')+'" data-k="'+k+'"><div class="fill"></div>'+esc(labels[k])+'</div>'}).join('');
}
function show(seg,instant){
  if(seg.key!=='champ')Champion.stop();
  if(!seg.overlay)Showcase.stop();
  cur=seg;
  var wipe=$('#wipe');
  if(!RM&&!instant){wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go')}
  $$('.seg',segs).forEach(function(o){if(o.classList.contains('out'))return;o.classList.add('out');o.classList.remove('in');setTimeout(function(){o.remove()},520)});
  clearTimeout(swapT);
  swapT=setTimeout(function(){
    var el=document.createElement('div');el.className='seg';
    try{seg.render(el)}catch(e){el.innerHTML='<div class="kick">RISE</div>'}
    stag(el);segs.appendChild(el);void el.offsetWidth;el.classList.add('in');
    $('#bgw').textContent=seg.word||'RISE';
  },instant||RM?0:300);
  renderChips();
}
function slot(now){
  list=playlist(new Date(now));if(!list.length)return null;
  var total=0;list.forEach(function(s){total+=Math.round(s.dur*1000)});
  var t=((now+offset)%total+total)%total,acc=0;
  for(var i=0;i<list.length;i++){var d=Math.round(list[i].dur*1000);if(t<acc+d)return {i:i,start:now-(t-acc),dur:d};acc+=d}
  return {i:0,start:now,dur:Math.round(list[0].dur*1000)};
}
function tick(force){
  if(paused&&!force)return;
  var now=Date.now(),s=slot(now);if(!s)return;
  var seg=list[s.i];curStart=s.start;segDur=s.dur;
  if(force||!cur||cur.key!==seg.key||(cur.sub||0)!==(seg.sub||0)){idx=s.i;show(seg,!cur)}
}
function go(dir){
  if(!cur)return;var now=Date.now(),el=now-curStart;
  if(dir>0)offset+=segDur-el+5;else{var p=list[(idx-1+list.length)%list.length];offset-=el+(p?Math.round(p.dur*1000):0)-5}
  clearTimeout(offT);offT=setTimeout(function(){offset=0;tick()},120000);
  if(paused)setPaused(false);else tick();
}
function setPaused(p){paused=p;$('#pz').hidden=!p;$('#bPause').textContent=p?'Play':'Pause';if(p)pausedAt=Date.now();else{offset=0;tick()}}
function frame(){
  if(cur&&!locked){var p=((paused?pausedAt:Date.now())-curStart)/segDur;var f=$('#chips .chip.on .fill');if(f)f.style.width=(Math.max(0,Math.min(1,p))*100).toFixed(2)+'%'}
  requestAnimationFrame(frame);
}

/* ---------- embers ---------- */
(function embers(){
  var c=$('#embers'),x=c.getContext('2d'),W=1920,H=1080,P=[],spr=document.createElement('canvas');spr.width=spr.height=64;
  var g=spr.getContext('2d'),rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba(255,236,170,1)');rg.addColorStop(.25,'rgba(255,170,40,.9)');rg.addColorStop(.6,'rgba(255,90,20,.25)');rg.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);
  function mk(init){return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:1+Math.random()*3.2,vy:.25+Math.random()*.9,ph:Math.random()*6.28,sw:.3+Math.random()*.9,life:.4+Math.random()*.6}}
  for(var i=0;i<(RM?26:80);i++)P.push(mk(true));
  function draw(){if(Champion.active()||Showcase.active()){requestAnimationFrame(draw);return}x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    for(var i=0;i<P.length;i++){var p=P[i];if(!RM){p.y-=p.vy*2;p.ph+=.02;p.x+=Math.sin(p.ph)*p.sw;if(p.y<-20)P[i]=p=mk(false)}
      var a=Math.max(0,Math.min(1,p.y/H))*p.life*(.75+.25*Math.sin(p.ph*3)),s=p.r*14;x.globalAlpha=a;x.drawImage(spr,p.x-s/2,p.y-s/2,s,s)}
    x.globalAlpha=1;if(!RM)requestAnimationFrame(draw)}
  draw();
})();

/* ---------- hud / keys ---------- */
var idleT;
function wake(){document.body.classList.add('awake');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.remove('awake')},3000)}
['mousemove','pointerdown','touchstart'].forEach(function(e){addEventListener(e,wake,{passive:true})});
function full(){var d=document.documentElement;try{if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){});else if(document.exitFullscreen)document.exitFullscreen().catch(function(){})}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
$('#bPrev').onclick=function(){go(-1)};$('#bNext').onclick=function(){go(1)};$('#bPause').onclick=function(){setPaused(!paused)};$('#bFull').onclick=full;
addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();setPaused(!paused)}
  else if(e.key==='f'||e.key==='F')full();
});

/* ---------- lock form ---------- */
$('#lockform').addEventListener('submit',function(e){
  e.preventDefault();var v=$('#setupIn').value.trim(),m=v.match(SETUP_RE);
  if(!m){$('#lockmsg').textContent='That is not a valid setup link.';return}
  CONN={id:m[1],key:m[2]};storeConn(CONN);$('#setupIn').value='';$('#lockmsg').textContent='Checking…';sync();
});

/* ---------- boot ---------- */
loadCache();
document.body.classList.toggle('locked',locked);
tickClock();renderFacts();renderTicker();renderWeather();renderYear();renderSync();
tick(true);
requestAnimationFrame(frame);
setInterval(function(){tick()},250);
setInterval(function(){tickClock();updateLive()},1000);
setInterval(function(){renderFacts();renderTicker();renderYear();renderSync()},30000);
sync();setInterval(sync,60000);
addEventListener('hashchange',function(){if(SETUP_RE.test(location.hash)){CONN=readConn();sync()}});
})();
</script>
