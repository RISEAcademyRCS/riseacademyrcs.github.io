*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ash);overflow:hidden}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}
body:not(.awake){cursor:none}

#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(.5);transform-origin:center;overflow:hidden;
  background:radial-gradient(1300px 640px at 78% 118%,rgba(255,106,26,.26),transparent 62%),radial-gradient(900px 520px at 6% -12%,rgba(245,180,0,.12),transparent 60%),var(--ink)}
#embers{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}

/* rail */
.rail{position:absolute;left:0;top:0;width:560px;height:984px;padding:52px 56px 40px;overflow:hidden;display:flex;flex-direction:column;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(22,17,12,.9),rgba(11,8,6,.35))}
.brand{display:flex;align-items:center;gap:22px}
.brand .logo{width:104px;height:104px;flex:0 0 auto;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 26px rgba(255,106,26,.4))}
.brand .nm{font:800 48px/.92 var(--display);letter-spacing:.04em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:10px;margin-top:12px;font:700 17px/1 var(--body);letter-spacing:.24em;color:var(--gold)}
.live i{width:12px;height:12px;border-radius:50%;background:#FF3B1F;animation:pulse 1.8s infinite}
.clock{margin-top:34px;display:flex;align-items:flex-start;font:800 196px/.8 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock .side{display:flex;flex-direction:column;gap:12px;margin:10px 0 0 14px}
.clock .sec{font-size:60px;line-height:.8;color:var(--gold)}
.clock .ap{font-size:40px;line-height:.8;color:var(--smoke)}
.dayname{margin-top:22px;font:800 70px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--gold)}
.datestr{margin-top:6px;font:500 30px/1.2 var(--body);color:var(--ash);opacity:.88}
.facts{margin-top:auto;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.facts h4{margin:0;font:700 16px var(--body);letter-spacing:.26em;color:var(--smoke);text-transform:uppercase}
.fact{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:baseline}
.fact .l{font:700 15px var(--body);letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.fact .v{font:500 23px/1.2 var(--body);color:var(--ash)}

/* main stage */
.main{position:absolute;left:560px;top:0;width:1360px;height:984px;overflow:hidden}
.bgword{position:absolute;right:-30px;bottom:30px;font:900 460px/.8 var(--display);color:transparent;-webkit-text-stroke:2px rgba(245,180,0,.09);white-space:nowrap;text-transform:uppercase;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.segwrap{position:absolute;left:96px;right:96px;top:84px;bottom:118px}
.seg{position:absolute;inset:0;display:flex;flex-direction:column}
.seg.out{animation:segout .5s cubic-bezier(.6,0,.8,.4) forwards}
.wipe{position:absolute;top:-10%;left:0;width:34%;height:120%;z-index:20;pointer-events:none;transform:translateX(-140%) skewX(-14deg);
  background:linear-gradient(90deg,transparent,rgba(255,106,26,.85) 30%,var(--gold) 70%,rgba(255,236,170,.9))}
.wipe.go{animation:wipe .8s cubic-bezier(.7,0,.25,1)}
.kick{display:flex;align-items:center;gap:16px;font:700 22px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.kick::before{content:"";width:52px;height:4px;background:var(--flame)}
.kick .n{color:var(--smoke);letter-spacing:.2em}
.h1{margin:30px 0 0;font:900 172px/.86 var(--display);text-transform:uppercase;text-wrap:balance}
.h2{margin:22px 0 0;font:800 104px/.9 var(--display);text-transform:uppercase;text-wrap:balance}
.gold{color:var(--gold)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.04em;margin-bottom:-.04em}
.w>span{display:inline-block}
.seg.in .w>span{animation:up .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--j)*70ms + 180ms)}
.seg.in .k{animation:rise .9s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i)*90ms + 320ms)}
.foot{margin-top:auto;font:600 20px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}

.chips{position:absolute;left:96px;right:96px;bottom:44px;display:flex;gap:12px}
.chip{flex:1;min-width:0;position:relative;padding-top:16px;font:700 15px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(244,238,229,.12)}
.chip .fill{position:absolute;left:0;top:0;height:4px;width:0;background:var(--gold)}
.chip.on{color:var(--ash)}

/* welcome */
.msg{margin-top:54px;max-width:1000px;padding-left:30px;border-left:6px solid var(--flame);font:600 52px/1.18 var(--body);text-wrap:balance}
.today-line{margin-top:auto;font:600 30px var(--body);color:var(--smoke);letter-spacing:.04em}
.today-line b{color:var(--ash);font-weight:700}

/* houses */
.houses{margin-top:58px;display:flex;flex-direction:column;gap:40px}
.hrow{display:grid;grid-template-columns:96px 1fr 220px;grid-template-rows:auto 26px;column-gap:30px;row-gap:14px;align-items:end}
.hrank{grid-row:1/3;font:900 116px/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--c)}
.hname{display:flex;align-items:center;gap:16px;font:800 58px/1 var(--display);text-transform:uppercase}
.hname svg{width:52px;height:40px;fill:var(--gold);filter:drop-shadow(0 0 12px rgba(245,180,0,.6))}
.hval{grid-row:1/3;grid-column:3;text-align:right;font:900 108px/.8 var(--display);font-variant-numeric:tabular-nums}
.htrack{grid-column:2;height:26px;background:rgba(244,238,229,.07);overflow:hidden}
.hfill{height:100%;width:calc(var(--w)*100%);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent),var(--c));box-shadow:0 0 34px var(--c)}
.seg.in .hfill{animation:grow 1.8s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(var(--i)*140ms + 500ms)}

/* sports */
.games{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.game{display:grid;grid-template-columns:140px 1fr auto;gap:36px;align-items:center;padding:18px 28px 18px 0;border-bottom:1px solid var(--line)}
.game.today{border-left:6px solid var(--gold);padding-left:24px;background:linear-gradient(90deg,rgba(245,180,0,.15),transparent 72%)}
.gdate{text-align:center;font-family:var(--display);line-height:.9}
.gdate span{display:block;font:700 20px var(--body);letter-spacing:.22em;color:var(--gold)}
.gdate b{display:block;font-weight:900;font-size:92px}
.gteam{font:800 54px/1 var(--display);text-transform:uppercase}
.gopp{margin-top:8px;font:600 36px/1.1 var(--body);color:var(--gold)}
.gtime{text-align:right;font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.gcd{margin-top:8px;font:600 21px var(--body);letter-spacing:.08em;color:var(--smoke)}
.badge{display:inline-block;margin-top:10px;padding:6px 12px;background:var(--flame);color:#1A0B02;font:800 17px var(--body);letter-spacing:.22em}
.badge.livepulse{animation:pulsebg 1.6s infinite}

/* lunch */
.menu{margin-top:36px;display:flex;flex-direction:column;gap:22px}
.dish{font:900 176px/.85 var(--display);text-transform:uppercase;text-wrap:balance}
.dish.long{font-size:124px}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;margin-top:22px}
.sidei{display:flex;align-items:center;gap:22px;font:700 60px/1 var(--display);text-transform:uppercase}
.sidei::before{content:"";flex:0 0 auto;width:18px;height:18px;background:var(--flame);transform:rotate(45deg)}

/* announcements */
.ann{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:48px;margin-top:10px}
.ann.withimg{grid-template-columns:minmax(0,1fr) 500px}
.ann .h2.s1{font-size:150px}.ann .h2.s2{font-size:112px}.ann .h2.s3{font-size:84px}
.ann p{margin:34px 0 0;font:500 46px/1.3 var(--body);color:var(--ash);opacity:.92;max-width:36ch}
.ann p.small{font-size:36px}
.ann .pic{min-height:0;display:flex;align-items:center}
.ann .pic img{display:block;width:100%;max-height:690px;object-fit:contain;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}

/* shoutouts */
.bday{margin-top:24px;font:900 196px/.82 var(--display);text-transform:uppercase;background:linear-gradient(92deg,var(--gold),var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent}
.bnames{margin-top:30px;font:800 74px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.shouts{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 48px}
.shout{border-top:4px solid var(--gold);padding-top:16px}
.shout b{display:block;font:800 50px/1 var(--display);text-transform:uppercase}
.shout span{display:block;margin-top:10px;font:500 30px/1.3 var(--body);color:var(--ash);opacity:.9}
.confetti{position:absolute;inset:-84px -96px 0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-40px;width:14px;height:28px;background:var(--c);opacity:.9;animation:fall var(--d) linear infinite;animation-delay:var(--dl)}

/* countdown */
.cd{display:flex;gap:30px;margin-top:64px}
.cd div{flex:1;border-top:4px solid var(--gold);padding-top:20px}
.cd b{display:block;font:900 224px/.84 var(--display);font-variant-numeric:tabular-nums}
.cd span{display:block;margin-top:12px;font:700 22px var(--body);letter-spacing:.3em;color:var(--smoke)}
.more{margin-top:auto;display:flex;gap:44px;flex-wrap:wrap;font:600 28px var(--body);color:var(--smoke)}
.more b{color:var(--ash)}

/* creed */
.creed-by{margin-top:14px;font:600 30px var(--body);color:var(--smoke)}
.creed{margin-top:40px;display:flex;flex-direction:column;gap:12px}
.cl{font:700 62px/1.1 var(--display);color:var(--ash);opacity:.26}
.creed.small .cl{font-size:46px}
.seg.in .cl{animation:lineon var(--t) ease forwards;animation-delay:var(--dl)}

/* ticker */
.ticker{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;background:#050302;border-top:2px solid var(--gold)}
.tlabel{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 64px 0 40px;background:var(--gold);color:#140A03;font:900 42px var(--display);letter-spacing:.06em;clip-path:polygon(0 0,100% 0,calc(100% - 30px) 100%,0 100%)}
.tview{flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ttrack{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;font:600 38px var(--body);animation:crawl 60s linear infinite}
.ttrack .sep{display:inline-block;width:14px;height:14px;margin:0 38px;background:var(--flame);transform:rotate(45deg)}
.ttrack b{color:var(--gold);font-weight:700}

/* paused tag */
.paused{position:absolute;right:96px;top:40px;font:700 16px var(--body);letter-spacing:.24em;color:var(--smoke);text-transform:uppercase}

/* hud */
.hud{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;opacity:0;transition:opacity .3s;pointer-events:none}
body.awake .hud{opacity:1;pointer-events:auto}
.hb{background:rgba(22,17,12,.9);color:var(--ash);border:1px solid var(--edge);border-radius:8px;padding:10px 14px;font:600 14px var(--body);cursor:pointer}
.hb.pri{background:var(--gold);color:#140A03;border-color:var(--gold)}
.hb:focus-visible,.btn:focus-visible,.etab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.live.stale i{background:var(--smoke);animation:none}
.live.stale{color:var(--smoke)}
.sync{margin-top:8px;font:500 15px var(--body);color:var(--smoke);letter-spacing:.04em}
a.hb{text-decoration:none;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,31,.7)}70%{box-shadow:0 0 0 14px rgba(255,59,31,0)}100%{box-shadow:0 0 0 0 rgba(255,59,31,0)}}
@keyframes pulsebg{50%{background:var(--gold)}}
@keyframes up{from{transform:translateY(108%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(54px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes segout{to{opacity:0;transform:translateY(-40px);filter:blur(12px)}}
@keyframes wipe{from{transform:translateX(-140%) skewX(-14deg)}to{transform:translateX(420%) skewX(-14deg)}}
@keyframes grow{from{width:0}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lineon{0%{opacity:1;color:var(--gold);transform:translateX(18px)}12%{transform:none}80%{color:var(--gold);opacity:1}100%{color:var(--ash);opacity:.92}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(1150px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .seg.in .k,.seg.in .w>span,.seg.in .hfill,.seg.out,.wipe.go,.bgword,.confetti i,.live i,.badge.livepulse{animation:none!important}
  .seg.in .cl{animation:none;opacity:.92}
  .ttrack{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ===== SETUP: paste the Google Sheet link between the quotes ===== */
var SHEET_LINK='';
/* ================================================================ */
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CROWN='<svg viewBox="0 0 52 40" aria-hidden="true"><path d="M2 10l12 10L26 2l12 18 12-10-5 26H7z"/></svg>';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pday(s){if(!s)return null;var a=String(s).split('-').map(Number);if(a.length<3||!a[0])return null;return new Date(a[0],a[1]-1,a[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtTime(t){if(!t)return'';var a=String(t).split(':').map(Number);var h=a[0],m=a[1]||0;var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap}
function fmtRange(a,b){if(!a)return'';if(!b)return fmtTime(a);var A=fmtTime(a),B=fmtTime(b);if(A.slice(-2)===B.slice(-2))A=A.slice(0,-3);return A+' – '+B}
function at(date,time){var d=pday(date);if(!d)return null;if(time){var a=time.split(':').map(Number);d.setHours(a[0],a[1]||0,0,0)}return d}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function fmtNum(n){return (Math.round(n*10)/10).toString()}
function safeColor(c){return /^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:'#F5B400'}
function shortDate(s){var d=pday(s);return d?MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate():''}
function words(t){return String(t||'').trim().split(/\s+/).filter(Boolean).length}
function split(text,start){var j=start||0;return String(text||'').split(/\s+/).filter(Boolean).map(function(w){return '<span class="w"><span style="--j:'+(j++)+'">'+esc(w)+'</span></span>'}).join(' ')}
function clean(a){return (a||[]).map(function(x){return String(x).trim()}).filter(Boolean)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}

/* ---------- data ---------- */
function normalize(d){
  d=d||{};
  d.settings=Object.assign({welcome:'Welcome to RISE Academy',seconds:12,autoTicker:true,segments:{}},d.settings||{});
  d.settings.segments=Object.assign({welcome:true,creed:true,houses:true,sports:true,lunch:true,ann:true,shout:true,count:true},d.settings.segments||{});
  ['messages','houses','games','lunch','announcements','shoutouts','countdowns','ticker'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});
  d.creed=Object.assign({title:'',author:'',lines:[]},d.creed||{});
  if(!Array.isArray(d.creed.lines))d.creed.lines=[];
  d.housesUpdated=d.housesUpdated||'';
  return d;
}
var S=normalize({});

function todayMsg(t){var m=S.messages.filter(function(x){return x.text&&(x.date===t||!x.date)});m.sort(function(a,b){return (b.date?1:0)-(a.date?1:0)});return m[0]||null}
function upcomingGames(now){
  var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),lim=addDays(t0,8);
  return S.games.filter(function(g){
    var st=at(g.date,g.start);if(!st||!g.team)return false;
    var d=pday(g.date);if(d<t0||d>=lim)return false;
    var en=g.end?at(g.date,g.end):new Date(st.getTime()+2*36e5);
    return en>now;
  }).sort(function(a,b){return at(a.date,a.start)-at(b.date,b.start)});
}
function lunchFor(now){
  var t=ymd(now),cut=now.getHours()*60+now.getMinutes()>=13*60+30;
  if(!cut){var e=S.lunch.find(function(l){return l.date===t&&clean(l.items).length});return e?{when:'Today',items:clean(e.items)}:null}
  for(var i=1;i<=4;i++){var d=addDays(now,i),k=ymd(d);var f=S.lunch.find(function(l){return l.date===k&&clean(l.items).length});
    if(f)return {when:i===1?'Tomorrow':DAYS[d.getDay()],items:clean(f.items)}}
  return null;
}
function activeAnns(t){return S.announcements.filter(function(a){return (a.title||a.body||a.image)&&(!a.start||a.start<=t)&&(!a.end||a.end>=t)})}
function shoutsFor(t){return S.shoutouts.filter(function(s){return s.name&&(!s.date||s.date===t)})}
function nextCountdowns(now){var t=ymd(now);return S.countdowns.filter(function(c){return c.label&&c.date&&c.date>t}).sort(function(a,b){return a.date<b.date?-1:1})}
function rankedHouses(){return S.houses.filter(function(h){return h.name}).slice().sort(function(a,b){return num(b.points)-num(a.points)})}

/* ---------- Google Sheet connection ---------- */
function sheetId(){
  var q='';try{q=new URLSearchParams(location.search).get('sheet')||''}catch(e){}
  var raw=q||SHEET_LINK||'';var m=String(raw).match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(raw.trim())?raw.trim():'');
}
var SID=sheetId(),CKEY='rise-live-cache-'+SID,lastSync=0,syncErr='';
function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function table(csv){
  var r=parseCSV(csv||'');if(!r.length)return [];
  var h=r[0].map(function(x){return String(x).trim().toLowerCase()});
  return r.slice(1).map(function(a){var o={};h.forEach(function(k,i){o[k]=String(a[i]==null?'':a[i]).trim()});return o})
    .filter(function(o){return Object.keys(o).some(function(k){return o[k]!==''})});
}
function col(o){for(var i=1;i<arguments.length;i++){var n=arguments[i];for(var k in o){if(k===n||k.indexOf(n)===0)return o[k]}}return ''}
function toYmd(v){v=String(v||'').trim();if(!v)return '';var m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){var y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[1])+'-'+pad(+m[2])}
  if((m=v.match(/^Date\((\d+),(\d+),(\d+)/)))return m[1]+'-'+pad(+m[2]+1)+'-'+pad(+m[3]);
  var d=new Date(v);return isNaN(d)?'':ymd(d)}
function toHM(v){v=String(v||'').trim();if(!v)return '';var m=v.match(/(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*([ap])\.?\s*m?\.?/i)||v.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return '';var h=+m[1],mi=+(m[2]||0);if(m[3]){var pm=/p/i.test(m[3]);if(h===12)h=pm?12:0;else if(pm)h+=12}
  return pad(h)+':'+pad(mi)}
function yes(v){return /^(y|yes|true|on|1|x|✓)$/i.test(String(v||'').trim())}
function imgUrl(v){v=String(v||'').trim();if(!v)return '';var m=v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(m)return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600';return /^https:\/\//.test(v)?v:''}
var TABNAMES=['Today','Lunch','Sports','Houses','Announcements','Shoutouts','Countdowns','Creed','Ticker','Settings'];
function buildData(T){
  var st={};(T.Settings||[]).forEach(function(r){var k=col(r,'setting');if(k)st[k.toLowerCase()]=col(r,'value')});
  function setting(k,d){return st[k]!==undefined&&st[k]!==''?st[k]:d}
  var segs={};[['welcome','show welcome'],['creed','show creed'],['houses','show house points'],['sports','show sports'],['lunch','show lunch'],['ann','show announcements'],['shout','show shoutouts'],['count','show countdowns']].forEach(function(p){var v=st[p[1]];segs[p[0]]=v===undefined||v===''?true:yes(v)});
  return normalize({
    settings:{welcome:setting('welcome headline','Welcome to RISE Academy'),seconds:num(setting('seconds per screen',12))||12,autoTicker:st['automatic ticker items']===undefined||st['automatic ticker items']===''?true:yes(st['automatic ticker items']),segments:segs},
    housesUpdated:toYmd(setting('standings as of','')),
    messages:(T.Today||[]).map(function(r){return {date:toYmd(col(r,'date')),text:col(r,'message')}}).filter(function(x){return x.text}),
    lunch:(T.Lunch||[]).map(function(r){var it=[col(r,'main')];Object.keys(r).forEach(function(k){if(k.indexOf('side')===0)it.push(r[k])});return {date:toYmd(col(r,'date')),items:clean(it)}}).filter(function(x){return x.date&&x.items.length}),
    games:(T.Sports||[]).map(function(r){return {date:toYmd(col(r,'date')),team:col(r,'team'),home:/home|vs/i.test(col(r,'home')),opponent:col(r,'opponent'),start:toHM(col(r,'start')),end:toHM(col(r,'end'))}}).filter(function(g){return g.date&&g.team}),
    houses:(T.Houses||[]).map(function(r){var c=col(r,'color');if(c&&c[0]!=='#')c='#'+c;return {name:col(r,'house'),points:num(col(r,'points')),color:c}}).filter(function(h){return h.name}),
    announcements:(T.Announcements||[]).map(function(r){return {title:col(r,'title'),body:col(r,'details'),start:toYmd(col(r,'show from')),end:toYmd(col(r,'show until')),image:imgUrl(col(r,'flyer'))}}).filter(function(a){return a.title||a.body}),
    shoutouts:(T.Shoutouts||[]).map(function(r){return {kind:/birth/i.test(col(r,'type'))?'birthday':'shoutout',name:col(r,'name'),note:col(r,'note'),date:toYmd(col(r,'date'))}}).filter(function(s){return s.name}),
    countdowns:(T.Countdowns||[]).map(function(r){return {label:col(r,'event'),date:toYmd(col(r,'date'))}}).filter(function(c){return c.label&&c.date}),
    creed:{title:setting('creed title',''),author:setting('creed author',''),lines:(T.Creed||[]).map(function(r){return col(r,'line')}).filter(Boolean)},
    ticker:(T.Ticker||[]).map(function(r){return col(r,'message')}).filter(Boolean)
  });
}
function fetchTab(name){
  var u='https://docs.google.com/spreadsheets/d/'+SID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name)+'&_='+Date.now();
  return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){
    if(/^\s*</.test(t))throw new Error('not shared');return t});
}
var dataKey='';
function applyData(d){var k=JSON.stringify(d);if(k===dataKey)return;dataKey=k;S=d;renderFacts();renderTicker();if(cur&&cur.key==='welcome'&&!SID)go(0)}
function sync(){
  if(!SID){syncErr='setup';renderSync();return}
  Promise.all(TABNAMES.map(function(n){return fetchTab(n).then(function(t){return [n,table(t),null]},function(e){return [n,[],e]})})).then(function(res){
    var ok=res.filter(function(r){return !r[2]});
    if(!ok.length){syncErr='Could not read the Google Sheet. Check that it is shared as “Anyone with the link can view”.';renderSync();return}
    var T={};res.forEach(function(r){T[r[0]]=r[1]});
    var d=buildData(T);lastSync=Date.now();syncErr='';
    try{localStorage.setItem(CKEY,JSON.stringify({at:lastSync,data:d}))}catch(e){}
    applyData(d);renderSync();
  });
}
function renderSync(){
  var el=$('#sync');if(!el)return;
  var fresh=lastSync&&Date.now()-lastSync<5*6e4;
  $('.live').classList.toggle('stale',!fresh);
  el.textContent=!SID?'Not connected':fresh?'Updated '+fmtClock(new Date(lastSync)):lastSync?'Offline · last update '+fmtClock(new Date(lastSync)):'Connecting…';
}
function fmtClock(d){var h=d.getHours()%12||12;return h+':'+pad(d.getMinutes())+' '+(d.getHours()>=12?'PM':'AM')}
(function loadCache(){try{var c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c&&c.data){S=normalize(c.data);lastSync=c.at||0;dataKey=JSON.stringify(S)}}catch(e){}})();

/* ---------- playlist ---------- */
function playlist(now){
  var on=S.settings.segments,base=Math.max(5,num(S.settings.seconds)||12),t=ymd(now),out=[];
  if(on.welcome)out.push({key:'welcome',label:'Welcome',word:'RISE',dur:base,render:rWelcome});
  var cl=S.creed.lines.filter(function(x){return String(x).trim()});
  if(on.creed&&cl.length)out.push({key:'creed',label:'Creed',word:'CREED',dur:Math.max(base,cl.length*3.4+4),render:rCreed});
  if(on.houses&&rankedHouses().length)out.push({key:'houses',label:'House Points',word:'HOUSES',dur:base+2,render:rHouses});
  if(on.sports&&upcomingGames(now).length)out.push({key:'sports',label:'Sports',word:'GAME DAY',dur:base+2,render:rSports});
  if(on.lunch&&lunchFor(now))out.push({key:'lunch',label:'Lunch',word:'LUNCH',dur:base,render:rLunch});
  if(on.ann){var an=activeAnns(t);an.forEach(function(a,i){out.push({key:'ann',sub:i,label:'Announcements',word:'NEWS',dur:Math.max(base,words(a.title+' '+a.body)*0.5+5),render:function(el){rAnn(el,a,i,an.length)}})})}
  if(on.shout&&shoutsFor(t).length)out.push({key:'shout',label:'Shoutouts',word:'SHOUT',dur:base+2,render:rShout});
  if(on.count&&nextCountdowns(now).length)out.push({key:'count',label:'Countdown',word:'SOON',dur:base,render:rCount});
  return out;
}

/* ---------- segment renderers ---------- */
function stag(el){$$('.k',el).forEach(function(n,i){n.style.setProperty('--i',i)})}
function greet(now){var h=now.getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function rWelcome(el){
  if(!SID){el.innerHTML='<div class="kick k">Setup</div><h1 class="h1" style="font-size:130px">'+split('Connect the Google Sheet')+'</h1><div class="msg k" style="font-size:38px">Paste the Sheet link into SHEET_LINK at the top of the page script, or add ?sheet= and the Sheet ID to this page’s address.</div>';return}
  var now=new Date(),m=todayMsg(ymd(now));
  el.innerHTML='<div class="kick k">'+greet(now)+', RISE</div>'+
    '<h1 class="h1">'+split(S.settings.welcome||'Welcome to RISE Academy')+'</h1>'+
    (m?'<div class="msg k">'+esc(m.text)+'</div>':'')+
    '<div class="today-line k">Today is <b>'+DAYS[now.getDay()]+', '+MONTHS[now.getMonth()]+' '+now.getDate()+'</b></div>';
}
function rCreed(el){
  var lines=S.creed.lines.filter(function(x){return String(x).trim()}),step=3.4;
  el.innerHTML='<div class="kick k">RISE Creed <span class="n">· Stand and recite</span></div>'+
    (S.creed.title?'<h2 class="h2" style="font-size:88px">'+split(S.creed.title)+'</h2>':'')+
    (S.creed.author?'<div class="creed-by k">'+esc(S.creed.author)+'</div>':'')+
    '<div class="creed'+(lines.length>7?' small':'')+'">'+lines.map(function(l,i){return '<div class="cl" style="--dl:'+(1.2+i*step)+'s;--t:'+step+'s">'+esc(l)+'</div>'}).join('')+'</div>';
}
function rHouses(el){
  var hs=rankedHouses(),max=Math.max.apply(null,hs.map(function(h){return num(h.points)}).concat([1]));
  var lead=hs.length>1?num(hs[0].points)-num(hs[1].points):0;
  var head=hs.length>1?(lead>0?split(hs[0].name)+' <span class="gold">'+split('leads by '+fmtNum(lead),words(hs[0].name))+'</span>':split('Tied at the top')):split(hs[0].name);
  el.innerHTML='<div class="kick k">House Points</div><h2 class="h2">'+head+'</h2>'+
    '<div class="houses">'+hs.map(function(h,i){var p=num(h.points);
      return '<div class="hrow k" style="--c:'+safeColor(h.color)+';--w:'+(p/max).toFixed(4)+'">'+
      '<div class="hrank">'+(i+1)+'</div><div class="hname">'+esc(h.name)+(i===0&&lead>0?CROWN:'')+'</div>'+
      '<div class="htrack"><div class="hfill" style="--i:'+i+'"></div></div><div class="hval" data-count="'+p+'">'+fmtNum(p)+'</div></div>'}).join('')+'</div>'+
    (S.housesUpdated?'<div class="foot k">Standings as of '+shortDate(S.housesUpdated)+'</div>':'');
  countUp(el);
}
function rSports(el){
  var now=new Date(),t=ymd(now),gs=upcomingGames(now).slice(0,4),nToday=gs.filter(function(g){return g.date===t}).length;
  var head=nToday?(nToday+' game'+(nToday>1?'s':'')+' today'):('Next up: '+DAYS[pday(gs[0].date).getDay()]);
  el.innerHTML='<div class="kick k">'+(nToday?'Game Day':'This Week in Sports')+'</div><h2 class="h2">'+split(head)+'</h2>'+
    '<div class="games">'+gs.map(function(g){var d=pday(g.date),td=g.date===t;
      return '<div class="game k'+(td?' today':'')+'"><div class="gdate"><span>'+DAYS[d.getDay()].slice(0,3).toUpperCase()+'</span><b>'+d.getDate()+'</b><span>'+MONTHS[d.getMonth()].slice(0,3).toUpperCase()+'</span></div>'+
      '<div><div class="gteam">'+esc(g.team)+'</div><div class="gopp">'+(g.home?'vs ':'@ ')+esc(g.opponent||'TBA')+(g.home?' · Home':'')+'</div></div>'+
      '<div class="gtime">'+fmtRange(g.start,g.end)+(td?'<div class="gcd" data-game="'+esc(g.date+'|'+g.start+'|'+(g.end||''))+'"></div>':'')+'</div></div>'}).join('')+'</div>';
  updateLive();
}
function rLunch(el){
  var l=lunchFor(new Date()),main=l.items[0],rest=l.items.slice(1);
  el.innerHTML='<div class="kick k">'+esc(l.when)+'’s Lunch</div><div class="menu"><div class="dish'+(main.length>16?' long':'')+'">'+split(main)+'</div>'+
    (rest.length?'<div class="sides">'+rest.map(function(s){return '<div class="sidei k">'+esc(s)+'</div>'}).join('')+'</div>':'')+'</div>';
}
function rAnn(el,a,i,n){
  var t=a.title||'',sz=t.length<=22?'s1':t.length<=46?'s2':'s3',bw=words(a.body);
  el.innerHTML='<div class="kick k">Announcements'+(n>1?' <span class="n">· '+(i+1)+' of '+n+'</span>':'')+'</div>'+
    '<div class="ann'+(a.image?' withimg':'')+'"><div>'+(t?'<h2 class="h2 '+sz+'">'+split(t)+'</h2>':'')+(a.body?'<p class="k'+(bw>40?' small':'')+'">'+esc(a.body)+'</p>':'')+'</div>'+
    (a.image?'<div class="pic k"><img alt="'+esc(a.title||'Announcement flyer')+'" src="'+esc(a.image)+'"></div>':'')+'</div>';
}
function rShout(el){
  var t=ymd(new Date()),all=shoutsFor(t),b=all.filter(function(s){return s.kind==='birthday'}),o=all.filter(function(s){return s.kind!=='birthday'});
  var h='<div class="kick k">'+(b.length?'Birthdays & Shoutouts':'Shoutouts')+'</div>';
  if(b.length)h+='<div class="bday k">Happy Birthday</div><div class="bnames k">'+b.map(function(x){return esc(x.name)}).join('<span class="gold"> · </span>')+'</div>';
  else h+='<h2 class="h2">'+split('Proud of you')+'</h2>';
  if(o.length)h+='<div class="shouts">'+o.slice(0,b.length?2:4).map(function(x){return '<div class="shout k"><b>'+esc(x.name)+'</b>'+(x.note?'<span>'+esc(x.note)+'</span>':'')+'</div>'}).join('')+'</div>';
  if(b.length&&!RM){var c='',cols=['#F5B400','#FF6A1A','#F4EEE5','#FFD45C'];for(var k=0;k<46;k++)c+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;--c:'+cols[k%4]+';--d:'+(4+Math.random()*4).toFixed(1)+'s;--dl:-'+(Math.random()*6).toFixed(1)+'s"></i>';h='<div class="confetti">'+c+'</div>'+h}
  el.innerHTML=h;
}
function rCount(el){
  var cs=nextCountdowns(new Date()),c=cs[0],rest=cs.slice(1,4);
  el.innerHTML='<div class="kick k">Countdown</div><h2 class="h2">'+split(c.label)+'</h2>'+
    '<div class="cd" data-cd="'+esc(c.date)+'"><div class="k"><b data-u="d">0</b><span>Days</span></div><div class="k"><b data-u="h">00</b><span>Hours</span></div><div class="k"><b data-u="m">00</b><span>Minutes</span></div><div class="k"><b data-u="s">00</b><span>Seconds</span></div></div>'+
    (rest.length?'<div class="more k">'+rest.map(function(r){return '<div><b>'+esc(r.label)+'</b> in '+daysUntil(r.date)+' days</div>'}).join('')+'</div>':'');
  updateLive();
}
function daysUntil(s){var d=pday(s),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((d-n)/864e5)}
function countUp(el){
  if(RM)return;
  $$('[data-count]',el).forEach(function(n,i){var to=num(n.dataset.count),dec=String(n.dataset.count).indexOf('.')>=0?1:0,t0=null,dl=500+i*140;
    n.textContent=(0).toFixed(dec);
    function f(ts){if(t0===null)t0=ts;var p=Math.min(1,Math.max(0,(ts-t0-dl)/1700));p=1-Math.pow(1-p,3);n.textContent=(to*p).toFixed(dec);if(p<1)requestAnimationFrame(f);else n.textContent=fmtNum(to)}
    requestAnimationFrame(f)});
}

/* ---------- live bits (each second) ---------- */
function updateLive(){
  var now=new Date();
  $$('[data-game]').forEach(function(n){var p=n.dataset.game.split('|'),st=at(p[0],p[1]),en=p[2]?at(p[0],p[2]):new Date(st.getTime()+2*36e5);
    if(now>=st&&now<en){n.innerHTML='<span class="badge livepulse">HAPPENING NOW</span>'}
    else if(now<st){var ms=st-now,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);n.innerHTML='<span class="badge">TODAY</span><div>Starts in '+(h?h+'h ':'')+pad(m)+'m</div>'}
    else n.textContent='Final'});
  $$('[data-cd]').forEach(function(n){var tg=pday(n.dataset.cd),ms=Math.max(0,tg-now);
    var v={d:Math.floor(ms/864e5),h:pad(Math.floor(ms%864e5/36e5)),m:pad(Math.floor(ms%36e5/6e4)),s:pad(Math.floor(ms%6e4/1e3))};
    $$('[data-u]',n).forEach(function(b){b.textContent=v[b.dataset.u]})});
}

/* ---------- stage shell ---------- */
var app=$('#app');
app.innerHTML=
 '<div id="stage" role="img" aria-label="RISE Live announcements screen">'+
  '<canvas id="embers" width="960" height="540"></canvas>'+
  '<aside class="rail"><div class="brand"><div class="logo" role="img" aria-label="RISE Academy logo"></div><div><div class="nm">RISE<br>Academy</div><div class="live"><i></i>LIVE</div><div class="sync" id="sync">Connecting…</div></div></div>'+
   '<div class="clock"><span id="hm">--:--</span><div class="side"><span class="sec" id="ss">00</span><span class="ap" id="ap">AM</span></div></div>'+
   '<div class="dayname" id="dn"></div><div class="datestr" id="ds"></div>'+
   '<div class="facts" id="facts"></div></aside>'+
  '<section class="main"><div class="bgword" id="bgw">RISE</div><div class="segwrap" id="segs"></div><div class="paused" id="pz" hidden>Paused</div><div class="chips" id="chips"></div><div class="wipe" id="wipe"></div></section>'+
  '<div class="ticker"><div class="tlabel">RISE NEWS</div><div class="tview"><div class="ttrack" id="tt"></div></div></div>'+
 '</div>'+
 '<nav class="hud" aria-label="Screen controls"><button class="hb" id="bPrev" title="Previous (←)">◀</button><button class="hb" id="bPause" title="Pause (Space)">Pause</button><button class="hb" id="bNext" title="Next (→)">▶</button><button class="hb" id="bFull" title="Fullscreen (F)">Fullscreen</button>'+(SID?'<a class="hb pri" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/'+SID+'/edit">Edit in Google Sheets</a>':'')+'</nav>';

var stage=$('#stage'),segs=$('#segs');
function fit(){
  var aw=innerWidth;
  var s=Math.min(aw/1920,innerHeight/1080);
  stage.style.left=(aw/2)+'px';stage.style.transform='translate(-50%,-50%) scale('+s+')';
}
addEventListener('resize',fit);fit();

function tickClock(){
  var n=new Date(),h=n.getHours()%12||12;
  $('#hm').textContent=h+':'+pad(n.getMinutes());$('#ss').textContent=pad(n.getSeconds());$('#ap').textContent=n.getHours()>=12?'PM':'AM';
  $('#dn').textContent=DAYS[n.getDay()];$('#ds').textContent=MONTHS[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear();
}
function renderFacts(){
  var now=new Date(),t=ymd(now),f=[],l=lunchFor(now),g=upcomingGames(now)[0],hs=rankedHouses(),c=nextCountdowns(now)[0];
  if(l)f.push(['Lunch'+(l.when==='Today'?'':' · '+l.when.slice(0,3)),l.items[0]+(l.items.length>1?' + '+(l.items.length-1)+' more':'')]);
  if(g)f.push(['Next game',g.team+' '+(g.home?'vs ':'@ ')+(g.opponent||'TBA')+' · '+(g.date===t?'':DAYS[pday(g.date).getDay()].slice(0,3)+' ')+fmtTime(g.start)]);
  if(hs.length)f.push(['Leading',hs[0].name+' · '+fmtNum(num(hs[0].points))]);
  if(c)f.push(['Coming up',c.label+' in '+daysUntil(c.date)+' day'+(daysUntil(c.date)===1?'':'s')]);
  $('#facts').innerHTML=f.length?'<h4>Today at RISE</h4>'+f.map(function(x){return '<div class="fact"><div class="l">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>'}).join(''):'';
}
var tickerKey='';
var tickerTimer=null;
function renderTicker(){
  var now=new Date(),t=ymd(now),items=S.ticker.filter(function(x){return String(x).trim()}).map(esc);
  if(S.settings.autoTicker){
    upcomingGames(now).filter(function(g){return g.date===t}).forEach(function(g){items.push('<b>Today:</b> '+esc(g.team)+' '+(g.home?'vs ':'@ ')+esc(g.opponent||'TBA')+', '+fmtTime(g.start))});
    var b=shoutsFor(t).filter(function(s){return s.kind==='birthday'});if(b.length)items.push('<b>Happy birthday</b> '+b.map(function(x){return esc(x.name)}).join(', ')+'!');
    var hs=rankedHouses();if(hs.length)items.push('<b>House race:</b> '+hs.map(function(h){return esc(h.name)+' '+fmtNum(num(h.points))}).join('  ·  '));
    var l=lunchFor(now);if(l)items.push('<b>'+esc(l.when)+'’s lunch:</b> '+esc(l.items.join(', ')));
    activeAnns(t).forEach(function(a){if(a.title)items.push('<b>'+esc(a.title)+'</b>')});
    nextCountdowns(now).slice(0,2).forEach(function(c){var d=daysUntil(c.date);items.push('<b>'+d+' day'+(d===1?'':'s')+'</b> until '+esc(c.label))});
  }
  if(!items.length)items=['<b>RISE Academy</b> · Rantoul, Illinois'];
  var key=items.join('|');if(key===tickerKey)return;tickerKey=key;
  var tt=$('#tt');clearInterval(tickerTimer);
  if(RM){var i=0;tt.style.position='static';tt.innerHTML=items[0];tickerTimer=setInterval(function(){i=(i+1)%items.length;tt.innerHTML=items[i]},7000);return}
  var one=items.map(function(x){return '<span>'+x+'</span><span class="sep"></span>'}).join('');
  tt.innerHTML=one+one;
  requestAnimationFrame(function(){var w=tt.scrollWidth/2;tt.style.animationDuration=Math.max(20,w/130)+'s'});
}

/* ---------- player ---------- */
var list=[],idx=-1,segStart=0,segDur=12000,paused=false,pauseLeft=0,cur=null,swapT=null;
function renderChips(){
  var keys=[],labels={};list.forEach(function(s){if(keys.indexOf(s.key)<0){keys.push(s.key);labels[s.key]=s.label}});
  $('#chips').innerHTML=keys.map(function(k){return '<div class="chip'+(cur&&cur.key===k?' on':'')+'" data-k="'+k+'"><div class="fill"></div>'+esc(labels[k])+'</div>'}).join('');
}
function show(seg,instant){
  cur=seg;
  var wipe=$('#wipe');
  if(!RM&&!instant){wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go')}
  $$('.seg',segs).forEach(function(o){if(o.classList.contains('out'))return;o.classList.add('out');o.classList.remove('in');setTimeout(function(){o.remove()},520)});
  clearTimeout(swapT);
  swapT=setTimeout(function(){
    var el=document.createElement('div');el.className='seg';
    try{seg.render(el)}catch(e){el.innerHTML='<div class="kick">RISE</div>'}
    stag(el);segs.appendChild(el);void el.offsetWidth;el.classList.add('in');
    $('#bgw').textContent=seg.word||'RISE';
  },instant||RM?0:300);
  segStart=performance.now();segDur=seg.dur*1000;
  renderChips();
}
function go(dir){
  var prev=cur;list=playlist(new Date());if(!list.length)return;
  if(prev){var pi=list.findIndex(function(s){return s.key===prev.key&&(s.sub||0)===(prev.sub||0)});idx=pi>=0?pi:Math.min(idx,list.length-1)}
  idx=((idx+dir)%list.length+list.length)%list.length;show(list[idx]);
}
function showKey(key){list=playlist(new Date());var i=list.findIndex(function(s){return s.key===key});if(i>=0){idx=i;show(list[i],true);return true}return false}
function setPaused(p){paused=p;$('#pz').hidden=!p;$('#bPause').textContent=p?'Play':'Pause';if(!p)segStart=performance.now()-(segDur-pauseLeft);else pauseLeft=Math.max(0,segDur-(performance.now()-segStart))}
function frame(ts){
  if(!paused&&cur&&ts-segStart>=segDur)go(1);
  if(cur){var p=paused?1-pauseLeft/segDur:Math.min(1,(ts-segStart)/segDur);var f=$('#chips .chip.on .fill');if(f)f.style.width=(p*100).toFixed(2)+'%'}
  requestAnimationFrame(frame);
}

/* ---------- embers ---------- */
(function embers(){
  var c=$('#embers'),x=c.getContext('2d'),W=960,H=540,P=[],spr=document.createElement('canvas');spr.width=spr.height=64;
  var g=spr.getContext('2d'),rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba(255,236,170,1)');rg.addColorStop(.25,'rgba(255,170,40,.9)');rg.addColorStop(.6,'rgba(255,90,20,.25)');rg.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);
  function mk(init){return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:1+Math.random()*3.2,vy:.25+Math.random()*.9,ph:Math.random()*6.28,sw:.3+Math.random()*.9,life:.4+Math.random()*.6}}
  for(var i=0;i<(RM?26:80);i++)P.push(mk(true));
  function draw(){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    for(var i=0;i<P.length;i++){var p=P[i];if(!RM){p.y-=p.vy;p.ph+=.02;p.x+=Math.sin(p.ph)*p.sw*.5;if(p.y<-20)P[i]=p=mk(false)}
      var a=Math.max(0,Math.min(1,p.y/H))*p.life*(.75+.25*Math.sin(p.ph*3)),s=p.r*7;x.globalAlpha=a;x.drawImage(spr,p.x-s/2,p.y-s/2,s,s)}
    x.globalAlpha=1;if(!RM)requestAnimationFrame(draw)}
  draw();
})();

/* ---------- hud / keys ---------- */
var idleT;
function wake(){document.body.classList.add('awake');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.remove('awake')},3000)}
['mousemove','pointerdown','touchstart'].forEach(function(e){addEventListener(e,wake,{passive:true})});
function full(){var d=document.documentElement;try{if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(function(){});else if(document.exitFullscreen)document.exitFullscreen().catch(function(){})}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
$('#bPrev').onclick=function(){go(-1)};$('#bNext').onclick=function(){go(1)};$('#bPause').onclick=function(){setPaused(!paused)};$('#bFull').onclick=full;
addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '){e.preventDefault();setPaused(!paused)}
  else if(e.key==='f'||e.key==='F')full();
});

/* ---------- boot ---------- */
tickClock();renderFacts();renderTicker();
list=playlist(new Date());idx=0;if(list.length)show(list[0],true);
requestAnimationFrame(frame);
setInterval(function(){tickClock();updateLive()},1000);
setInterval(function(){renderFacts();renderTicker();renderSync();var l=playlist(new Date());if(l.length!==list.length){list=l;renderChips()}},30000);
sync();setInterval(sync,60000);renderSync();
})();
</script>
